name: Auto Tag Modules (Safe)

on:
  push:
    branches: [ main ]
  # Dispatch from main to rerun the same idempotent tagging algorithm.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One tagging run at a time, in push order, never cancelled mid-flight. Runs
# for consecutive pushes otherwise finish in either order, and the run for
# the older commit compared itself against the newer commit's tag (#1941).
#
# GitHub keeps at most one PENDING run per group: a newer pending run
# replaces an older one. That is safe here. A run tags every module that
# changed between its last tag and the commit it runs on, and main only
# moves forward, so the newer commit contains the replaced run's commit and
# tags its changes. The script also refuses to tag a module whose last tag
# is not an ancestor of the commit, so ordering is not what correctness
# rests on.
concurrency:
  group: auto-tag-modules
  cancel-in-progress: false

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        # Tag the commit selected by the triggering event, with all tags available.
        ref: ${{ github.sha }}
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Verify manual target
      if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
      run: |
        echo "Manual tag recovery must be dispatched from main; refusing ${GITHUB_REF}."
        exit 1

    - name: Set up Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Analyze commits and tag modules
      id: tag
      # The algorithm lives in the script so scripts/auto-tag-modules.test.sh
      # can run it against throwaway repositories.
      run: ./scripts/auto-tag-modules.sh

    - name: Generate summary
      if: always() && steps.tag.outcome != 'skipped'
      run: |
        echo "## 📦 Module Tagging Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [[ -s tagged_modules.txt ]]; then
          echo "### ✅ Successfully Tagged" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The following modules were automatically versioned based on their commits:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          while IFS=: read -r module version; do
            echo "- **${module}** → ${version}" >> $GITHUB_STEP_SUMMARY
            echo "  - Install: \`go get github.com/KirkDiggler/rpg-toolkit/${module}@${module}/${version}\`" >> $GITHUB_STEP_SUMMARY
          done < tagged_modules.txt
          echo "" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [[ -s skipped_modules.txt ]]; then
          echo "### ⚠️  Skipped (Already Exists)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The following tags were skipped because they already exist:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          while IFS=: read -r module version reason; do
            echo "- **${module}** → ${version} (${reason})" >> $GITHUB_STEP_SUMMARY
          done < skipped_modules.txt
          echo "" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [[ -s deferred_modules.txt ]]; then
          echo "### ⏭️ Deferred (A Later Run Already Tagged)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This commit (\`${GITHUB_SHA::8}\`) is an ancestor of each module's highest tag, so that tag already contains it. Nothing was tagged here:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          while IFS=: read -r module tag sha; do
            echo "- **${module}**: ${tag} at \`${sha}\`" >> $GITHUB_STEP_SUMMARY
          done < deferred_modules.txt
          echo "" >> $GITHUB_STEP_SUMMARY
        fi

        if [[ -s refused_modules.txt ]]; then
          echo "### ❌ Refused (Highest Tag Is Off Main)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Each module's highest tag is not in the history of this commit (\`${GITHUB_SHA::8}\`), so no version can be minted without breaking version order. Nothing was tagged for:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          while IFS=: read -r module tag sha; do
            echo "- **${module}**: ${tag} at \`${sha}\`" >> $GITHUB_STEP_SUMMARY
          done < refused_modules.txt
          echo "" >> $GITHUB_STEP_SUMMARY
        fi

        if [[ ! -s tagged_modules.txt ]] && [[ ! -s skipped_modules.txt ]] && [[ ! -s deferred_modules.txt ]] && [[ ! -s refused_modules.txt ]]; then
          echo "### ℹ️ No Module Changes" >> $GITHUB_STEP_SUMMARY
          echo "No modules had changes that required new version tags." >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Version Bump Rules:" >> $GITHUB_STEP_SUMMARY
        echo "- \`feat:\` commits trigger **minor** version bump (0.X.0)" >> $GITHUB_STEP_SUMMARY
        echo "- \`fix:\` commits trigger **patch** version bump (0.0.X)" >> $GITHUB_STEP_SUMMARY
        echo "- \`BREAKING CHANGE\` triggers **major** version bump (X.0.0)" >> $GITHUB_STEP_SUMMARY