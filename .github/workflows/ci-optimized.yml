name: CI Optimized

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Dispatch from main to check its selected commit without push-event fields.
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  # The test budget. Every module's tests run with -json, and
  # scripts/test-budget.sh writes the module's ten slowest top-level tests to
  # the job summary. TEST_BUDGET is the target: a top-level test over it
  # under -race is reported "over target" with its seconds, in the summary
  # and the log, and the job stays green. The job fails naming each test over
  # twice the target (test-budget.sh -hard, default 2x). Why two lines: one
  # test's CI time varies about 2x between runs, so a hard line at the target
  # flaps on tests near it. The target is still 5s, and the sizing issues
  # (rpg-toolkit#2342, #2343) stand. A test may stay over the hard line only
  # when the module's allowlist, .github/testbudget/<module dir>.allow (for
  # example .github/testbudget/rulebooks/dnd5e/encounter.allow), names it.
  # The allowlists live outside the modules so editing one mints no module
  # tag; a module without a file has no exceptions. One test per line, as its
  # package's import path (go test -json's Package field), a slash and the
  # top-level test name, with its reason after a "#" on the same line: why it
  # is over budget (what it builds or sweeps and why that cannot shrink), or
  # the one issue that will size it. For example:
  #   github.com/KirkDiggler/rpg-toolkit/rulebooks/dnd5e/encounter/TestObserversOf_EqualsFullRefresh  # the castle row needs a posted guard, arrivals and table-only creatures (rpg-project#909)
  # A bare test name is an error: it would exempt every package's test.
  # A line without a reason, or with "not yet sized" alone, fails the job too.
  # The budget is judged on CI's timing, not a dev box's. A slow test is a
  # finding: size the fixture to the cases it proves, or name it with a
  # reason (rpg-project#907). Locally:
  # go test -race -json ./... | "$(git rev-parse --show-toplevel)/scripts/test-budget.sh" check -module <module dir>
  TEST_BUDGET: 5s
  # The encounter module outgrew one CI job (rpg-toolkit#2335). It runs as
  # three shards: "heavy" runs these root-package tests with -run, "rest" runs
  # the root package with the same regex as -skip, and "subpackages" runs every
  # other package unfiltered. One regex feeds both flags, so a test cannot fall
  # between the shards. A test moves here when its own time says so; the job
  # summary prints each shard's time.
  SHARDED_MODULE: rulebooks/dnd5e/encounter
  ENCOUNTER_HEAVY_TESTS: '^(TestObserversOf_EqualsFullRefresh|TestTheGarrisonsDoorOpeningsAreTheWholeFloorScans|TestPlacedReach_AgreesWithTheWalk)$'

jobs:
  # Detect what changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
      matrix: ${{ steps.detect.outputs.matrix }}
      all_modules: ${{ steps.detect.outputs.all_modules }}
      should_run_all: ${{ steps.detect.outputs.should_run_all }}
    steps:
    - uses: actions/checkout@v4
      with:
        # Keep every job on the commit selected by the triggering event.
        ref: ${{ github.sha }}
        fetch-depth: 0

    - name: Verify manual target
      if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
      run: |
        echo "Manual CI recovery must be dispatched from main; refusing ${GITHUB_REF}."
        exit 1
    
    - name: Detect changed modules
      id: detect
      run: |
        # For main branch pushes, always run all
        if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
          # The matrix of test-changed is evaluated even when its if is false;
          # an unset modules output makes fromJson fail the whole job graph.
          echo "modules=[]" >> $GITHUB_OUTPUT
          echo "should_run_all=true" >> $GITHUB_OUTPUT
          echo "Running all checks for main branch push"
          exit 0
        fi
        
        # Manual recovery validates the selected main commit in full. Its
        # parent diff may contain only workflow files, not the missed module.
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          # The matrix of test-changed is evaluated even when its if is false;
          # an unset modules output makes fromJson fail the whole job graph.
          echo "modules=[]" >> $GITHUB_OUTPUT
          echo "should_run_all=true" >> $GITHUB_OUTPUT
          echo "Running all checks for manual recovery"
          exit 0
        fi

        # Check if PR has "full-check" label
        if [[ "${{ contains(github.event.pull_request.labels.*.name, 'full-check') }}" == "true" ]]; then
          # The matrix of test-changed is evaluated even when its if is false;
          # an unset modules output makes fromJson fail the whole job graph.
          echo "modules=[]" >> $GITHUB_OUTPUT
          echo "should_run_all=true" >> $GITHUB_OUTPUT
          echo "Running all checks due to 'full-check' label"
          exit 0
        fi
        
        # Get list of changed files
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          ALL_CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
        else
          ALL_CHANGED=$(git diff --name-only HEAD^ HEAD)
        fi

        # Some files are not IN a module but change what checking a module
        # MEANS: the lint config, the pinned linter version, the workflow, the
        # Makefile targets CI calls, and the scripts behind them.
        #
        # Matching only '\.go$' made those changes invisible. A pull request
        # touching just .golangci.yml detected no modules, skipped every check,
        # and reported ci-status SUCCESS — a green that had run nothing. PR
        # #1635 rewrites the lint config for all 26 modules and was never once
        # linted by CI for exactly this reason.
        #
        # Fail LOUD instead: an infrastructure change checks everything.
        INFRA_CHANGED=$(echo "$ALL_CHANGED" | grep -E '(^|/)\.golangci\.ya?ml$|^\.golangci-version$|^\.github/workflows/|^Makefile$|^scripts/' || true)
        if [[ -n "$INFRA_CHANGED" ]]; then
          # The matrix of test-changed is evaluated even when its if is false;
          # an unset modules output makes fromJson fail the whole job graph.
          echo "modules=[]" >> $GITHUB_OUTPUT
          echo "should_run_all=true" >> $GITHUB_OUTPUT
          echo "Running all checks — lint/CI infrastructure changed:"
          echo "$INFRA_CHANGED"
          exit 0
        fi

        CHANGED_FILES=$(echo "$ALL_CHANGED" | grep '\.go$' || true)

        # A test budget allowlist lives outside its module
        # (.github/testbudget/<module dir>.allow); a change to one checks
        # that module.
        ALLOW_MODULES=$(echo "$ALL_CHANGED" | sed -n 's#^\.github/testbudget/\(.*\)\.allow$#\1#p')
        
        if [[ -z "$CHANGED_FILES" && -z "$ALLOW_MODULES" ]]; then
          echo "No Go files changed"
          echo "modules=[]" >> $GITHUB_OUTPUT
          echo "should_run_all=false" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        # Find modules with changes
        MODULES=()
        for file in $CHANGED_FILES; do
          dir=$(dirname "$file")
          while [[ ! -f "$dir/go.mod" && "$dir" != "." && "$dir" != "/" ]]; do
            dir=$(dirname "$dir")
          done
          if [[ -f "$dir/go.mod" ]]; then
            MODULES+=("$dir")
          fi
        done
        for dir in $ALLOW_MODULES; do
          if [[ -f "$dir/go.mod" ]]; then
            MODULES+=("$dir")
          fi
        done
        
        # Handle empty modules array (e.g., deleted files with no remaining go.mod)
        if [[ ${#MODULES[@]} -eq 0 ]]; then
          echo "No modules found for changed files (files may have been deleted)"
          echo "modules=[]" >> $GITHUB_OUTPUT
          echo "should_run_all=false" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        # Remove duplicates and format as JSON array
        UNIQUE_MODULES=$(printf '%s\n' "${MODULES[@]}" | sort -u | jq -R . | jq -s -c .)
        echo "modules=$UNIQUE_MODULES" >> $GITHUB_OUTPUT
        echo "should_run_all=false" >> $GITHUB_OUTPUT

        # One job per module, except the sharded module, which gets three.
        MATRIX=$(echo "$UNIQUE_MODULES" | jq -c --arg sharded "$SHARDED_MODULE" \
          '[.[] | if . == $sharded then {module: ., shard: "heavy"}, {module: ., shard: "rest"}, {module: ., shard: "subpackages"} else {module: ., shard: "all"} end]')
        echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
        
        echo "Changed modules: $UNIQUE_MODULES"
        echo "Test jobs: $MATRIX"

  # Run checks on changed modules only (for PRs)
  test-changed:
    name: test-changed (${{ matrix.module }}${{ matrix.shard != 'all' && format(' {0}', matrix.shard) || '' }})
    needs: changes
    if: needs.changes.outputs.should_run_all == 'false' && needs.changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    # The job holds setup, lint and the module's test binaries (run in
    # parallel), each binary capped at 25m below. 40m is that cap plus setup.
    timeout-minutes: 40
    strategy:
      # include-only: each entry is one job, {module, shard}. A go-version axis
      # here would collapse the entries into one combination, so the version
      # is set on the setup-go step instead.
      matrix:
        include: ${{ fromJson(needs.changes.outputs.matrix) }}
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.x'
    
    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-${{ matrix.module }}-${{ hashFiles(format('{0}/go.sum', matrix.module)) }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.module }}-
    
    # No coverage in CI: nobody reads the file, and atomic cover is most of the
    # race test time. Locally: `make coverage` (a few modules), or in a module
    # `go test -race -coverprofile=coverage.txt -covermode=atomic ./...`.
    # shell: bash is load-bearing: it runs the step as bash -eo pipefail, so
    # a failing go test fails the step through the log filter's pipe. A run:
    # step without shell: is bash -e only, where the filter's exit 0 hides
    # the failure. The set -o pipefail below is the same guarantee for anyone
    # who copies the commands out of this step.
    - name: Check module ${{ matrix.module }} (${{ matrix.shard }})
      shell: bash
      env:
        SHARD: ${{ matrix.shard }}
      run: |
        echo "🔍 Checking module: ${{ matrix.module }} (shard: $SHARD)"
        cd "${{ matrix.module }}"

        # fmt, tidy and lint run once per module, in the "all" or "rest" job;
        # the other shards only run their tests.
        if [[ "$SHARD" == "all" || "$SHARD" == "rest" ]]; then
          echo "→ Running go fmt..."
          go fmt ./...
          
          echo "→ Running go mod tidy..."
          go mod tidy
          
          echo "→ Installing golangci-lint..."
          "$GITHUB_WORKSPACE/scripts/install-golangci-lint.sh"

          echo "→ Running linter..."
          golangci-lint run ./...
        fi
        
        echo "→ Running tests..."
        # -json feeds the test budget step; the log filter prints what plain
        # go test would. pipefail keeps go test's exit (see shell: above).
        set -o pipefail
        budgeted() {
          "$@" | tee "$RUNNER_TEMP/test.json" | "$GITHUB_WORKSPACE/scripts/test-budget.sh" log
        }
        start=$(date +%s)
        # Each test binary gets 25m, not Go's default 10m (rpg-toolkit#2336).
        case "$SHARD" in
          all)
            budgeted go test -race -json -timeout 25m ./...
            ;;
          heavy)
            budgeted go test -race -json -timeout 25m -run "$ENCOUNTER_HEAVY_TESTS" .
            ;;
          rest)
            budgeted go test -race -json -timeout 25m -skip "$ENCOUNTER_HEAVY_TESTS" .
            ;;
          subpackages)
            # Unfiltered, so a subpackage test sharing a heavy name still runs.
            budgeted go test -race -json -timeout 25m $(go list ./... | grep -vxF "$(go list .)")
            ;;
          *)
            echo "❌ Unknown shard: $SHARD"
            exit 1
            ;;
        esac
        elapsed=$(( $(date +%s) - start ))
        {
          echo "| module | shard | tests |"
          echo "|---|---|---|"
          echo "| ${{ matrix.module }} | $SHARD | ${elapsed}s |"
        } >> "$GITHUB_STEP_SUMMARY"
        
        echo "✅ Module ${{ matrix.module }} ($SHARD) passed all checks"

    - name: Test budget ${{ matrix.module }} (${{ matrix.shard }})
      if: ${{ !cancelled() }}
      run: |
        if [[ ! -s "$RUNNER_TEMP/test.json" ]]; then
          echo "No test output: the module step stopped before its tests."
          exit 0
        fi
        "$GITHUB_WORKSPACE/scripts/test-budget.sh" check -budget "$TEST_BUDGET" \
          -module "${{ matrix.module }}" \
          -label "${{ matrix.module }} (${{ matrix.shard }})" \
          < "$RUNNER_TEMP/test.json"

    - name: Check for modifications
      run: |
        if [[ -n $(git status --porcelain) ]]; then
          echo "❌ Files were modified during checks:"
          git status --porcelain
          echo "Please run 'go fmt ./...' and 'go mod tidy' locally"
          exit 1
        fi

  # Run all checks (for main branch or full-check label)
  test-all:
    needs: changes
    if: needs.changes.outputs.should_run_all == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.27.x']
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
    
    - name: Install tools
      run: make install-tools
    
    - name: Run linter on all modules
      run: make lint-all
    
    # make test-all's loop, with -json per module for the test budget step.
    # shell: bash is load-bearing (bash -eo pipefail), as in "Check module":
    # without pipefail the log filter's exit 0 hides a failing test.
    - name: Run tests on all modules
      shell: bash
      run: |
        set -o pipefail
        mkdir -p "$RUNNER_TEMP/test-json"
        find . -name "go.mod" -type f -not -path "./vendor/*" | sort | while read -r modfile; do
          dir=$(dirname "$modfile")
          dir=${dir#./}
          echo "→ Testing $dir..."
          (cd "$dir" && go test -race -json ./... \
            | tee "$RUNNER_TEMP/test-json/${dir//\//__}.json" \
            | "$GITHUB_WORKSPACE/scripts/test-budget.sh" log) || exit 1
        done

    - name: Test budget, every module
      if: ${{ !cancelled() }}
      run: |
        status=0
        for json in "$RUNNER_TEMP"/test-json/*.json; do
          [[ -s "$json" ]] || continue
          name=$(basename "$json" .json)
          dir=${name//__//}
          "$GITHUB_WORKSPACE/scripts/test-budget.sh" check -budget "$TEST_BUDGET" \
            -module "$dir" < "$json" || status=1
        done
        exit $status

    - name: Check go mod tidy on all modules
      run: |
        # Run go mod tidy on all modules
        find . -name "go.mod" -type f -not -path "./vendor/*" | while read -r modfile; do
          dir=$(dirname "$modfile")
          echo "→ Tidying $dir..."
          (cd "$dir" && go mod tidy) || exit 1
        done
        git diff --exit-code || (echo "Please run 'go mod tidy' on all modules" && exit 1)

  # Summary job for branch protection
  # The ADR digest is the file everyone is told to read INSTEAD of the corpus,
  # so an ADR missing from it is invisible. This directory's own README index
  # already drifted to listing 7 of 37 with nothing failing, which is the
  # precedent. Cheap, no Go toolchain needed.
  docs-decisions:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Every ADR is summarised in docs/adr/DECISIONS.md
      run: ./scripts/check-decisions.sh

  # Each level's knowledge/map.md draws exactly the modules beneath it, and
  # the root composes the level maps. A module added, moved or retired without
  # its map edit is red here, not a stale picture. Cheap, no Go toolchain needed.
  knowledge-map:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Every module appears in exactly one knowledge map
      run: ./scripts/check-knowledge-map.sh

  # The tagger mints the releases every consumer pins, and a wrong tag cannot
  # be taken back once the Go proxy caches it. Its cases run against
  # throwaway repositories. Cheap, no Go toolchain needed.
  tagger:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: The module tagger mints only where history allows
      run: ./scripts/auto-tag-modules.test.sh

  # The test budget's reader decides which tests fail CI; its cases run on
  # fixture streams. Cheap, no Go toolchain needed.
  test-budget:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: The test budget reads go test -json as its cases say
      run: ./scripts/test-budget.test.sh

  ci-status:
    needs: [changes, test-changed, test-all, docs-decisions, knowledge-map, tagger, test-budget]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: CI Status Summary
      run: |
        echo "📊 CI Summary:"
        echo "Changes detection: ${{ needs.changes.result }}"
        echo "Changed modules test: ${{ needs.test-changed.result }}"
        echo "All modules test: ${{ needs.test-all.result }}"
        echo "ADR digest: ${{ needs.docs-decisions.result }}"
        echo "Knowledge maps: ${{ needs.knowledge-map.result }}"
        echo "Module tagger: ${{ needs.tagger.result }}"
        echo "Test budget cases: ${{ needs.test-budget.result }}"
        
        # Fail if any required job failed
        if [[ "${{ needs.changes.result }}" == "failure" ]]; then
          echo "❌ Changes detection failed"
          exit 1
        fi
        
        # If we ran changed modules test, check its result
        if [[ "${{ needs.test-changed.result }}" == "failure" ]]; then
          echo "❌ Changed modules test failed"
          exit 1
        fi
        
        # If we ran all modules test, check its result
        if [[ "${{ needs.test-all.result }}" == "failure" ]]; then
          echo "❌ All modules test failed"
          exit 1
        fi

        if [[ "${{ needs.docs-decisions.result }}" == "failure" ]]; then
          echo "❌ An ADR is missing from docs/adr/DECISIONS.md"
          exit 1
        fi

        if [[ "${{ needs.knowledge-map.result }}" == "failure" ]]; then
          echo "❌ A module and the knowledge maps disagree"
          exit 1
        fi

        if [[ "${{ needs.tagger.result }}" == "failure" ]]; then
          echo "❌ The module tagger's cases failed"
          exit 1
        fi

        if [[ "${{ needs.test-budget.result }}" == "failure" ]]; then
          echo "❌ The test budget's cases failed"
          exit 1
        fi
        
        echo "✅ All CI checks passed!"