name: API Compatibility

on:
  pull_request:
    paths:
      - 'play/clock/**'
      - 'play/intel/**'
      - 'play/record/**'

jobs:
  gorelease-play-clock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: gorelease play/clock
        run: |
          base=$(git tag -l 'play/clock/v*' --sort=-v:refname | head -1)
          if [ -z "$base" ]; then
            echo "no play/clock tag yet — first release, gate activates from the first tag"
            exit 0
          fi
          cd play/clock
          go run golang.org/x/exp/cmd/gorelease@v0.0.0-20260727155853-b88d891fe743 -base "${base#play/clock/}"

  gorelease-play-intel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: gorelease play/intel
        run: |
          base=$(git tag -l 'play/intel/v*' --sort=-v:refname | head -1)
          if [ -z "$base" ]; then
            echo "no play/intel tag yet — first release, gate activates from the first tag"
            exit 0
          fi
          cd play/intel
          go run golang.org/x/exp/cmd/gorelease@v0.0.0-20260727155853-b88d891fe743 -base "${base#play/intel/}"

  gorelease-play-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: gorelease play/record
        run: |
          base=$(git tag -l 'play/record/v*' --sort=-v:refname | head -1)
          if [ -z "$base" ]; then
            echo "no play/record tag yet — first release, gate activates from the first tag"
            exit 0
          fi
          cd play/record
          go run golang.org/x/exp/cmd/gorelease@v0.0.0-20260727155853-b88d891fe743 -base "${base#play/record/}"
