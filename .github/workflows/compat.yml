name: API Compatibility

on:
  pull_request:
    paths:
      - 'play/clock/**'
      - 'play/intel/**'
      - 'play/record/**'
      - 'play/interrupt/**'
      - 'rulebooks/dnd5e/encounter/**'
      - 'rulebooks/dnd5e/session/**'

# GOPRIVATE is set PER JOB, to the module under test only (see each job's env).
# Repo-wide (#1768) it also sent every dependency to git, and a dependency's
# go.mod may pin a pseudo-version whose commit was squashed away: dnd5e
# v0.169.0 pins tools/spatial at a8a4dd3fc92a, which git no longer has and only
# the proxy still serves. Per module, the gate reads the module's own tags
# fresh from git and its dependencies from the proxy, which is what each side
# is good for.
jobs:
  gorelease-play-clock:
    runs-on: ubuntu-latest
    env:
      # GOPRIVATE for THIS module only: its tags come straight from git (the
      # stale-proxy trap, #1768), while its dependencies still resolve through
      # the proxy, which keeps pseudo-versions whose commits were squashed away
      # (dnd5e v0.169.0 pins tools/spatial at a revision git no longer has).
      GOPRIVATE: github.com/KirkDiggler/rpg-toolkit/play/clock
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: gorelease play/clock
        run: |
          base=$(git tag -l 'play/clock/v*' --sort=-v:refname | head -1)
          if [ -z "$base" ]; then
            echo "no play/clock tag yet — first release, gate activates from the first tag"
            exit 0
          fi
          cd play/clock
          go run golang.org/x/exp/cmd/gorelease@v0.0.0-20260727155853-b88d891fe743 -base "${base#play/clock/}"

  gorelease-play-intel:
