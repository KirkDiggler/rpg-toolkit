version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - integration

linters:
  enable:
    # Default linters (all good to keep)
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Additional valuable linters
    - bodyclose      # Check HTTP response body is closed
    - copyloopvar    # Detect places where loop variables are copied
    - dupl           # Find duplicate code
    - goconst        # Find repeated strings that could be constants
    - gocritic       # Comprehensive checks for bugs, performance, style
    - gocyclo        # Check cyclomatic complexity
    - goprintffuncname # Printf-like functions should end with 'f'
    - gosec          # Security checks
    - lll            # Line length limit
    - misspell       # Find misspelled words
    - nakedret       # Find naked returns
    - noctx          # Find missing context.Context
    - prealloc       # Find slices that could be preallocated
    - revive         # Comprehensive linter, replaces golint
    - rowserrcheck   # Check sql.Rows.Err
    - unconvert      # Remove unnecessary type conversions
    - unparam        # Find unused parameters
    - whitespace     # Check unnecessary newlines

  exclusions:
    rules:
      # Test files are fixtures, not product — these linters skip them.
      # (Migrated from the v1 `issues.exclude-rules` block: golangci-lint v2
      # silently ignores v1-syntax sections, so under the v2.15.0 pin these
      # findings fired in _test.go files while that block sat in the file. #2148.)
      - path: _test\.go
        linters: [dupl, errcheck, goconst, gosec, gocyclo]

      # refs/ namespace pattern is intentionally similar for IDE discoverability
      - path: refs/
        linters: [dupl]

      # Exclude from example files
      - path: example_test\.go
        linters: [lll, gocritic, revive]

      # Allow longer lines in generate directives
      - source: "^//go:generate "
        linters: [lll]

      # ---- Shrinking exception list --------------------------------------------
      # Debt raised by the golangci-lint v2.3.1 → v2.15.0 bump in #2148: one
      # rule per module still carrying findings. The PR that fixes a module's
      # findings deletes that module's rule here in the same commit. When
      # this list is empty, delete the whole block.
      - path: ^mind/behavior/       # 4 goconst (answer.go, table.go)
        linters: [goconst]
      - path: ^tools/environments/  # 26 goconst
        linters: [goconst]
      - path: ^tools/selectables/   # 5 goconst + gosec G115 + unparam (basic_table.go)
        linters: [goconst, gosec, unparam]

    paths:
      # vendor (if any) and generated files
      - vendor/
      - _gen\.go

# DEAD under golangci-lint v2: this v1-syntax section is silently ignored by
# every v2 pin — the runtime drops it without a word and only
# `golangci-lint config verify` notices. Restoring it is not a config fix but
# a gate-policy change: these settings have never been enforced on this tree,
# and re-arming them fires ~380 findings (measured 2026-10-29; per-setting
# inventory and decision menu in #2153). Do not nest this under
# `linters.settings` without that decision.
linters-settings:
  dupl:
    threshold: 150
  
  errcheck:
    check-type-assertions: true
  
  goconst:
    min-len: 3
    min-occurrences: 3
  
  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - dupImport # https://github.com/go-critic/go-critic/issues/845
      - whyNoLint
  
  gocyclo:
    min-complexity: 15
  
  govet:
    check-shadowing: true
  
  lll:
    line-length: 140
    tab-width: 4
  
  misspell:
    locale: US
  
  nakedret:
    max-func-lines: 30
  
  prealloc:
    simple: true
    range-loops: true
    for-loops: false
  
  revive:
    ignore-generated-header: true
    severity: warning
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports

# DEAD under golangci-lint v2 — see the note on linters-settings above (#2153).
formatters-settings:
  gofmt:
    simplify: true
  
  goimports:
    local-prefixes: github.com/KirkDiggler