version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - integration

linters:
  enable:
    # Default linters (all good to keep)
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Additional valuable linters
    - bodyclose      # Check HTTP response body is closed
    - copyloopvar    # Detect places where loop variables are copied
    - dupl           # Find duplicate code
    - goconst        # Find repeated strings that could be constants
    - gocritic       # Comprehensive checks for bugs, performance, style
    - gocyclo        # Check cyclomatic complexity
    - goprintffuncname # Printf-like functions should end with 'f'
    - gosec          # Security checks
    - lll            # Line length limit
    - misspell       # Find misspelled words
    - nakedret       # Find naked returns
    - nilnil         # Never return (nil, nil) — a valid object or an error (#2220)
    - noctx          # Find missing context.Context
    - prealloc       # Find slices that could be preallocated
    - revive         # Comprehensive linter, replaces golint
    - rowserrcheck   # Check sql.Rows.Err
    - unconvert      # Remove unnecessary type conversions
    - unparam        # Find unused parameters
    - whitespace     # Check unnecessary newlines

  # Live since #2153's ruling (2026-11-04): this block sat at the top level in
  # v1 syntax, silently ignored by every v2 pin — the settings were authored,
  # never enforced. lll's limit moves from the authored 140 to 200 by ruling:
  # the config is pragmatic about widescreens, with golangci's recommended set
  # as the standing direction for everything else.
  settings:
    dupl:
      threshold: 150

    errcheck:
      check-type-assertions: true

    goconst:
      min-len: 3
      min-occurrences: 3

    gocyclo:
      min-complexity: 30

    lll:
      line-length: 200
      tab-width: 4

    nakedret:
      max-func-lines: 30

    prealloc:
      simple: true
      range-loops: true
      for-loops: false

    revive:
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf

  exclusions:
    rules:
      # Test files are fixtures, not product — these linters skip them.
      # (Migrated from the v1 `issues.exclude-rules` block: golangci-lint v2
      # silently ignores v1-syntax sections, so under the v2.15.0 pin these
      # findings fired in _test.go files while that block sat in the file. #2148.)
      # nilnil joined by ruling (#2220): the test-stub findings are faithful
      # to the seams they fake, so holding tests to the law is a seam
      # reshape, not a test fix. lll joined by ruling (#2153): fixtures wrap
      # their tables as they please; product lines answer the 200 limit.
      - path: _test\.go
        linters: [dupl, errcheck, goconst, gosec, gocyclo, lll, nilnil]

      # refs/ namespace pattern is intentionally similar for IDE discoverability
      - path: refs/
        linters: [dupl]

      # Exclude from example files
      - path: example_test\.go
        linters: [lll, gocritic, revive]

      # Allow longer lines in generate directives
      - source: "^//go:generate "
        linters: [lll]


    paths:
      # vendor (if any) and generated files
      - vendor/
      - _gen\.go

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports

  # Live since #2153's ruling (2026-11-04) — see the note on linters.settings.
  settings:
    gofmt:
      simplify: true

    goimports:
      local-prefixes: [github.com/KirkDiggler]
