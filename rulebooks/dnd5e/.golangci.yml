version: "2"

# This file SHADOWS the root config for every module under rulebooks/dnd5e/
# (golangci-lint discovers the nearest config walking up from the module dir),
# so the dnd5e subtree lints against THIS file, not the root's linter set —
# ~3.5k findings the root linters would raise, measured 2026-11-03, filed
# as its own issue (#2254). nilnil lives in BOTH files until that is ruled
# on; the drain exclusion below keeps session's conversion (#2220) from
# failing CI while its PR lands.
linters:
  default: standard
  enable:
    - nilnil
  exclusions:
    rules:
      - path: _test\.go
        linters: [nilnil]

      - path: ^session/
        linters: [nilnil]

linters-settings:
  dupl:
    threshold: 150  # Increase threshold for duplicate detection

run:
  skip-dirs:
    - character/choices/testdata

issues:
  exclude-rules:
    # Exclude dupl in test files - test patterns are often similar
    - path: _test\.go
      linters:
        - dupl
