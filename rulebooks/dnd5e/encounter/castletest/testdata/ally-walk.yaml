# THE ALLY WALK (Frank's list S3 companions, rpg-project#717): a throwaway
# site that lives only in the franks-list-s1 api worktree, the castle stack's
# content dir, and rpg-toolkit's encounter castletest/testdata (its one
# scenario test). CUT FROM THE CASTLE through the gate walk
# (dungeonspec/testdata/world-builder-v4-castle.yaml): the gatehouse, its five
# walls, the open south door, the closed gate, and the open ground round it.
# The gate guards are dropped; nothing here needs them.
#
# The cast:
#   veteran    on the open ground outside the gatehouse, neutral. His line
#              `join` (Persuasion DC 10, no requires) lands `veteran-joined`,
#              and that fact turns the party and his side ALLIED (`then:
#              allied`) and his side and the thugs hostile (the castle's
#              garrison-and-loyalists cascade, in one disposition each).
#   thug-1, thug-2  inside the gatehouse, hostile to the party, tucked in its
#              two south corners against the door wall, where no cell of the
#              open ground outside sees them through the door. Step in and
#              they are four cells off either side; the open ground outside
#              is the way past, and a party can leave them be.
#
# The veteran's table: strike a foe in reach, walk at one in sight, and once
# joined, with no foe, FOLLOW the nearest ally (`toward: ally`). Not joined,
# he holds. His route to an ally ends beside them, never at crossbow range.
#
# TRY IT (lobby: "ally-walk").
#   1. Walk to the veteran and say `join` (Persuasion, DC 10). He answers
#      "Aye. Lead on." The record's stance beat says party and veterans are
#      allied.
#   2. Walk away along the open ground, east or west, a few cells at a time.
#      End each walk: the veteran's pick is the `toward ally` row and he walks
#      up beside you. Stand still beside him: his pick says "already beside
#      its ally".
#   3. Walk in through the open south door. The thugs see you and the fight
#      forms; the veteran is in it on your side. End turns: he strikes a thug,
#      never you.
#   4. Play again and walk away WITHOUT saying `join`: he holds where he is.
version: 4
key: ally-walk
play: {void: transparent, lighting: bright, standing: centre-covered}
templates:
  veteran:
    base: dnd5e:monsters:human
    name: Veteran
    hitDice: 9d8
    armor: dnd5e:armor:splint
    abilities: {str: 16, dex: 13, con: 14}
    proficiency: 2
    actions: ['dnd5e:weapons:longsword', 'dnd5e:weapons:heavy-crossbow']
  thug:
    base: dnd5e:monsters:human
    name: Thug
    hitDice: 5d8
    armor: dnd5e:armor:leather
    abilities: {str: 15, con: 14}
    actions: ['dnd5e:weapons:mace']
tables:
  veteran:
    time:
    - when: {enemy: reach}
      attack: enemy
    - when: {enemy: seen}
      toward: enemy
    - when:
      - {fact: veteran-joined}
      - {enemy: none}
      toward: ally
    - when:
      - not: {fact: veteran-joined}
      - {enemy: none}
      hold: {}
  thug:
    time:
    - when: {enemy: reach}
      attack: enemy
    - when: {enemy: seen}
      toward: enemy
    - when: {enemy: none}
      hold: {}
factions:
- {id: veterans}
- {id: thugs}
dispositions:
- between: [party, veterans]
  stance: neutral
  until: {fact: veteran-joined}
  then: allied
- between: [veterans, thugs]
  stance: neutral
  until: {fact: veteran-joined}
- between: [thugs, party]
  stance: hostile
