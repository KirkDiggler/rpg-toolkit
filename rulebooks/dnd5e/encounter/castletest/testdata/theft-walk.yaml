# THE THEFT WALK (Frank's list S5, rpg-project#719): a throwaway site that
# lives only in the franks-list-s1 api worktree, the castle stack's content
# dir, and rpg-toolkit's encounter castletest/testdata (its one scenario
# test). CUT FROM THE CASTLE through the gate walk
# (dungeonspec/testdata/world-builder-v4-castle.yaml): the gatehouse, its five
# walls, the open south door, the closed gate, and the open ground round it.
# The gate guards, the captain and the watchers are dropped; nobody here
# fights.
#
# The cast, both civil and neither on a table (they stand):
#   cook    inside the gatehouse, the castle's cook (faction kitchen, his
#           mind). `pilfer` (Sleight of Hand DC 13): a failure says "Thief!"
#           and teaches `caught-in-kitchen` to whoever saw it. `pilfer` and
#           `gossip` (Persuasion DC 10) both require
#           `{ not: { fact: caught-in-kitchen } }`: withheld from a SPEAKER
#           who knows it (D3), offered to anybody who does not.
#   pedlar  on the open ground outside, four cells west of the start. One
#           line, `tonight`, with no requires.
#
# The way out, `front-door`, is the start. The last one out ends the run:
# `clean-getaway` (success) if nobody in the run knows `caught-in-kitchen`,
# the leave ending's `if: { not: { fact } }`; `caught` (failure) if not.
#
# TRY IT (lobby: "theft-walk").
#   1. Walk in through the open south door to the cook. The Speak menu offers
#      `pilfer` and `gossip`.
#   2. Say `pilfer` and fail it (Sleight of Hand, DC 13): the cook says
#      "Thief!" and the record shows `caught-in-kitchen` learned. The cook's
#      menu is now empty for that character. A second character who stayed
#      outside still sees both lines when they walk in.
#   3. Walk out to the pedlar: `tonight` is offered and answers.
#   4. Leave by the front door: `caught`, outcome failure. Play again, beat
#      the pilfer or skip it, and leave: `clean-getaway`, outcome success.
version: 5
key: theft-walk
play: {void: transparent, lighting: bright, standing: centre-covered}
# The castle's commoner, under an id no rulebook monster has.
templates:
  yard-commoner:
    base: dnd5e:monsters:human
    name: Commoner
    hitDice: 1d8
    actions: ['dnd5e:weapons:club']
factions:
- {id: kitchen, mind: cook}
- {id: townsfolk}
dispositions:
- between: [kitchen, party]
  stance: neutral
- between: [townsfolk, party]
  stance: neutral
exits:
- id: front-door
  cell: {q: -2, r: 16}
endings:
- id: clean-getaway
  when: {left: front-door}
  if:
    not: {fact: caught-in-kitchen}
  outcome: success
- id: caught
  when: {left: front-door}
  outcome: failure
