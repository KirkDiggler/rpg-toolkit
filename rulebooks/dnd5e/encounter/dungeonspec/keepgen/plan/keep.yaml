      - { assetRef: "dnd5e:props:fantasy-kingdom:bed_02", width: 1.7, depth: 1.88, blocksMovement: true, blocksLineOfSight: false }
      - { assetRef: "dnd5e:props:fantasy-kingdom:bed_03", width: 1.48, depth: 1.62, blocksMovement: true, blocksLineOfSight: false }
