      - { assetRef: "dnd5e:props:fantasy-kingdom:chest_01", width: 0.75, depth: 0.46, blocksMovement: false, blocksLineOfSight: false }
      - { assetRef: "dnd5e:props:fantasy-kingdom:clothes_rack_01_preset_01", width: 1.63, depth: 0.51, blocksMovement: true, blocksLineOfSight: true }
    monsters: [dnd5e:monsters:guard, dnd5e:monsters:knight]
  library:
    props:
      - { assetRef: "dnd5e:props:fantasy-kingdom:shelf_03", width: 0.66, depth: 0.33, blocksMovement: true, blocksLineOfSight: true }
      - { assetRef: "dnd5e:props:fantasy-kingdom:books_01", width: 0.72, depth: 0.18, blocksMovement: false, blocksLineOfSight: false }
      - { assetRef: "dnd5e:props:fantasy-kingdom:books_02", width: 0.41, depth: 0.18, blocksMovement: false, blocksLineOfSight: false }
      - { assetRef: "dnd5e:props:fantasy-kingdom:books_03", width: 0.74, depth: 0.18, blocksMovement: false, blocksLineOfSight: false }
      - { assetRef: "dnd5e:props:fantasy-kingdom:books_04", width: 0.24, depth: 0.18, blocksMovement: false, blocksLineOfSight: false }
