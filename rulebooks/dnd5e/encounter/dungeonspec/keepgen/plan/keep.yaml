# The stat blocks the monster palettes name, the castle's own
# (testdata/world-builder-v4-castle.yaml), carried into the site so a launch
# resolves `dnd5e:monsters:<id>` the way it does for the castle.
templates:
  guard:
    base: dnd5e:monsters:human
    name: Guard
    hitDice: 2d8
    armor: dnd5e:armor:chain-shirt
    abilities: { str: 13, con: 12, wis: 11 }
    skills: [perception]
    actions: [dnd5e:weapons:spear]
  knight:
    base: dnd5e:monsters:human
    name: Knight
    hitDice: 8d8
    armor: dnd5e:armor:plate
    abilities: { str: 16, dex: 11, con: 14, wis: 11, cha: 15 }
    proficiency: 2
    actions: [dnd5e:weapons:greatsword]
  commoner:
    base: dnd5e:monsters:human
    name: Commoner
    hitDice: 1d8
    actions: [dnd5e:weapons:club]
  prisoner:
    base: dnd5e:monsters:human
    name: Prisoner
    actions: [dnd5e:weapons:club]
