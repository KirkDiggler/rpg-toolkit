      - { assetRef: "dnd5e:props:fantasy-kingdom:crate_stack_01", width: 2.44, depth: 0.91, blocksMovement: true, blocksLineOfSight: true }
      - { assetRef: "dnd5e:props:fantasy-kingdom:crate_stack_02", width: 2.44, depth: 1.45, blocksMovement: true, blocksLineOfSight: true }
      - { assetRef: "dnd5e:props:fantasy-kingdom:sack_stack_01", width: 0.75, depth: 0.75, blocksMovement: false, blocksLineOfSight: false }
      - { assetRef: "dnd5e:props:fantasy-kingdom:shelf_03", width: 0.66, depth: 0.33, blocksMovement: true, blocksLineOfSight: true }
      - { assetRef: "dnd5e:props:fantasy-kingdom:bread_crate_01", width: 0.62, depth: 0.39, blocksMovement: false, blocksLineOfSight: false }
    monsters: [dnd5e:monsters:commoner]
  quarters:
