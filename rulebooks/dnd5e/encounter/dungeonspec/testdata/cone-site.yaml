# THE CONE SITE (rpg-project#621, sneaking Task K1): one open room, authored
# in the encounter studio and exported through its own encoder
# (exportDraftYaml, the studio's "download draft"), cut down from the zone
# site's export script. No hand edits below this header.
#
#   room    offset cols -8..7, rows -4..6, no wall: the party start at its
#           south, col 3 row 6.
#   knight  stands at col 3 row 0, authored facing n, civil to the party.
#   cook    a commoner at col -5 row 0, authored facing n, civil too.
#
# Neither creature has orders, so neither turns. cone_site_test.go plays it.
version: 5
key: cone-site
play:
  void: transparent
  lighting: bright
  standing: centre-covered
factions:
  - id: watch
  - id: kitchen
dispositions:
  - between:
      - watch
      - party
    stance: neutral
  - between:
      - kitchen
      - party
    stance: neutral
  - between:
      - watch
      - kitchen
    stance: neutral
room:
  version: 3
  id: room-1
  name: Cone Site
  coordinateFrame:
    horizontalPlane: world-xz
    verticalAxis: world-y-up
    distanceUnit: world-scene-unit
    hexRadius: 1
    footprintFrame: owner-local-xz
  scene:
    version: 3
    id: scene-1
    name: Cone Site
    items: []
    groups: []
    mapLabels: []
  room:
    implicitRegionId: room-1-region
    regions:
      - id: room-1-region
        name: Cone Site
        lighting: { intensity: 1 }
        cells: []
      - id: region-hall
        name: Hall
        lighting: { intensity: 1 }
        cells:
          - r: -4
            q: [[-6, 9]]
          - r: -3
            q: [[-6, 9]]
          - r: -2
            q: [[-7, 8]]
          - r: -1
            q: [[-7, 8]]
          - r: 0
            q: [[-8, 7]]
          - r: 1
            q: [[-8, 7]]
          - r: 2
            q: [[-9, 6]]
          - r: 3
            q: [[-9, 6]]
          - r: 4
            q: [[-10, 5]]
          - r: 5
            q: [[-10, 5]]
          - r: 6
            q: [[-11, 4]]
    propDeclarations: {}
    arrangementDeclarations: {}
    monsterDeclarations:
      - id: knight
        ref: dnd5e:monsters:knight
        startingCell:
          location:
            q: 3
            r: 0
          facing: n
      - id: cook
        ref: dnd5e:monsters:commoner
        startingCell:
          location:
            q: -5
            r: 0
          facing: n
    partyStart:
      q: 0
      r: 6
    monsterBindings:
      knight:
        faction: watch
      cook:
        faction: kitchen
