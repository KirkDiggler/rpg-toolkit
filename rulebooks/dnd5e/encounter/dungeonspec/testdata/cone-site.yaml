# THE CONE SITE (rpg-project#621, sneaking Task K1): one open room, authored
# in the encounter studio and exported through its own encoder
# (exportDraftYaml, the studio's "download draft"), cut down from the zone
# site's export script. No hand edits below this header.
#
#   room    offset cols -8..7, rows -4..6, no wall: the party start at its
#           south, col 3 row 6.
#   knight  stands at col 3 row 0, authored facing n, civil to the party.
#   cook    a commoner at col -5 row 0, authored facing n, civil too.
#
# Neither creature has orders, so neither turns. cone_site_test.go plays it.
version: 4
key: cone-site
play:
  void: transparent
  lighting: bright
  standing: centre-covered
factions:
  - id: watch
  - id: kitchen
dispositions:
  - between:
      - watch
      - party
    stance: neutral
  - between:
      - kitchen
      - party
    stance: neutral
  - between:
      - watch
      - kitchen
    stance: neutral
