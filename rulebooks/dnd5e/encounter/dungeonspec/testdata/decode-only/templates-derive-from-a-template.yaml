# DECODE-ONLY: a template that derives from another template (rpg-project#555,
# T2). `captain` names `guard` as its base, and `guard` is declared right
# here — so the captain's base is not the rulebook's, it is this file's, and
# a chain of templates is a second inheritance system nobody designed.
# Templates derive from the rulebook, not from each other.
version: 4
key: templates-derive-from-a-template
play: { void: transparent, lighting: bright, standing: centre-covered }

templates:
  guard:
    base: dnd5e:monsters:human
    hitDice: 2d8
  captain:
    base: dnd5e:monsters:guard
    hitDice: 10d8

room:
  version: 3
  id: room-1
  name: Refused
  coordinateFrame: {horizontalPlane: world-xz, verticalAxis: world-y-up,
    distanceUnit: world-scene-unit, hexRadius: 1,
    footprintFrame: owner-local-xz}
  workspace: { hexRadius: 6, horizontalLimit: 12 }
  scene: { version: 1, id: scene-1, name: Refused, items: [], groups: [] }
  room:
    implicitRegionId: room-1-region
    walkableHexes: [{q: 0, r: 0}, {q: 1, r: 0}]
    propDeclarations: {}
    arrangementDeclarations: {}
    partyStart: {q: 0, r: 0}
    monsterDeclarations:
      - {id: captain-1, ref: "dnd5e:monsters:captain", startingCell: { location: { q: 1, r: 0 } }}
