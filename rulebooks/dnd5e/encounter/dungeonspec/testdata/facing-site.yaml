# THE FACING SITE (rpg-project#582, sneaking Task F1): one room, authored in
# the encounter studio and exported through its own encoder (exportDraftYaml,
# the studio's "download draft"), cut down from the castle's export script.
# No hand edits below this header.
#
#   knight  patrols a four-waypoint loop, authored facing e (90). Its first
#           leg runs six cells straight down column q = 0, so one world round
#           at thirty feet is exactly that leg.
#   guard   stands in the west with `toward: enemy`.
#
# facing_site_test.go plays it.
version: 4
key: facing-site
play:
  void: transparent
  lighting: bright
  standing: centre-covered
factions:
  - id: watch
  - id: garrison
dispositions:
  - between:
      - watch
      - party
    stance: neutral
  - between:
      - watch
      - garrison
    stance: neutral
  - between:
      - garrison
      - party
    stance: hostile
room:
  version: 3
  id: room-1
  name: Facing Site
  coordinateFrame:
    horizontalPlane: world-xz
    verticalAxis: world-y-up
    distanceUnit: world-scene-unit
    hexRadius: 1
    footprintFrame: owner-local-xz
  workspace:
