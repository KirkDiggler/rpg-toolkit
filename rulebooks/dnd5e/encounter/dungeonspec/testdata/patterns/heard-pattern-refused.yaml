# The refused twin of heard-pattern.yaml (rpg-project#684 L3): no sound
# this build makes is a bell or a gong, so the condition could never hold,
# and the form refuses it rather than accepting a row that never fires.
version: 5
key: heard-pattern-refused
play: {void: transparent, lighting: bright, standing: centre-covered}
room:
  version: 3
  id: room-1
  name: Gatehouse
  coordinateFrame: {horizontalPlane: world-xz, verticalAxis: world-y-up,
    distanceUnit: world-scene-unit, hexRadius: 1,
    footprintFrame: owner-local-xz}
  scene:
    version: 1
    id: scene-1
    name: Gatehouse
    items: []
    groups: []
  room:
    implicitRegionId: room-1-region
    # Every hex within three of the centre.
    regions:
      - id: room-1-region
        name: Gatehouse
        lighting: { intensity: 1 }
        cells:
          - r: -3
            q: [[0, 3]]
          - r: -2
            q: [[-1, 3]]
          - r: -1
            q: [[-2, 3]]
          - r: 0
            q: [[-3, 3]]
          - r: 1
            q: [[-3, 2]]
          - r: 2
            q: [[-3, 1]]
          - r: 3
            q: [[-3, 0]]
    propDeclarations: {}
    arrangementDeclarations: {}
    partyStart: {q: -3, r: 0}
    monsterDeclarations:
      - {id: gate-patrol, ref: 'dnd5e:monsters:goblin', startingCell: { location: { q: -2, r: 0 } }}
      - {id: keep-patrol, ref: 'dnd5e:monsters:goblin', startingCell: { location: { q: 0, r: 0 } }}
    monsterBindings:
      gate-patrol:
        on:
          time:
            - {when: {heard: {kind: '/bell|gong/', within: 2}}, toward: sound}
            - {when: {enemy: none}, toward: {path: [{q: -2, r: 0}, {q: 0, r: -2}, {q: 2, r: 0}, {q: 0, r: 2}]}}
      keep-patrol:
        on:
          time:
            - {when: {enemy: none}, toward: {at: {q: 1, r: 1}}}
