# A `heard` pattern over the sounds a file can make (rpg-project#670 R16,
# rpg-project#684 L3). gate-patrol walks to a clang or a bell; this build
# makes a clang whenever anybody swings, so the pattern matches an authored
# sound and is read. bundles_test.go pins it; the castle carries no pattern.
version: 4
key: heard-pattern
play: {void: transparent, lighting: bright, standing: centre-covered}
room:
  version: 3
  id: room-1
  name: Gatehouse
  coordinateFrame: {horizontalPlane: world-xz, verticalAxis: world-y-up,
    distanceUnit: world-scene-unit, hexRadius: 1,
    footprintFrame: owner-local-xz}
  workspace: {hexRadius: 6, horizontalLimit: 12}
  scene:
    version: 1
    id: scene-1
    name: Gatehouse
    items: []
    groups: []
  room:
    implicitRegionId: room-1-region
    # Every hex within three of the centre.
    walkableHexes: [
      {q: -3, r: 0}, {q: -3, r: 1}, {q: -3, r: 2}, {q: -3, r: 3},
      {q: -2, r: -1}, {q: -2, r: 0}, {q: -2, r: 1}, {q: -2, r: 2}, {q: -2, r: 3},
      {q: -1, r: -2}, {q: -1, r: -1}, {q: -1, r: 0}, {q: -1, r: 1}, {q: -1, r: 2}, {q: -1, r: 3},
      {q: 0, r: -3}, {q: 0, r: -2}, {q: 0, r: -1}, {q: 0, r: 0}, {q: 0, r: 1}, {q: 0, r: 2}, {q: 0, r: 3},
      {q: 1, r: -3}, {q: 1, r: -2}, {q: 1, r: -1}, {q: 1, r: 0}, {q: 1, r: 1}, {q: 1, r: 2},
      {q: 2, r: -3}, {q: 2, r: -2}, {q: 2, r: -1}, {q: 2, r: 0}, {q: 2, r: 1},
      {q: 3, r: -3}, {q: 3, r: -2}, {q: 3, r: -1}, {q: 3, r: 0}]
    propDeclarations: {}
    arrangementDeclarations: {}
    partyStart: {q: -3, r: 0}
    monsterDeclarations:
      - {id: gate-patrol, ref: 'dnd5e:monsters:goblin', startingCell: { location: { q: -2, r: 0 } }}
      - {id: keep-patrol, ref: 'dnd5e:monsters:goblin', startingCell: { location: { q: 0, r: 0 } }}
    monsterBindings:
      gate-patrol:
        on:
          time:
            - {when: {heard: {kind: '/clang|bell/', within: 2}}, toward: sound}
            - {when: {enemy: none}, toward: {path: [{q: -2, r: 0}, {q: 0, r: -2}, {q: 2, r: 0}, {q: 0, r: 2}]}}
      keep-patrol:
        on:
          time:
            - {when: {enemy: none}, toward: {at: {q: 1, r: 1}}}
