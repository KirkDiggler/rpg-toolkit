# THE PAUSE-FACING SITE (rpg-project#624): one open room, authored in the
# encounter studio and exported through its own encoder (exportDraftYaml, the
# studio's "download draft"), cut down from the cone site's export. One hand
# edit, marked below: the route editor does not yet write a waypoint's pause.
#
#   room    the cone site's: offset cols -8..7, rows -4..6, no wall; the
#           party start at its south, axial { q: 0, r: 6 }.
#   guard   civil to the party, posted at { q: -6, r: 0 }, pacing a loop of
#           three waypoints: east along row 0 to { q: 2, r: 0 }, which
#           states `wait: 2, facing: s` — stand two rounds there facing
#           south; south-west to { q: -2, r: 4 }, which states nothing; and
#           back north-west to the first.
#
# pause_facing_site_test.go plays it.
version: 5
key: pause-facing-site
play:
  void: transparent
  lighting: bright
  standing: centre-covered
factions:
  - id: watch
dispositions:
  - between:
      - watch
      - party
    stance: neutral
tables:
  pacing:
    time:
      # Hand edit: the guard paces his loop, and the waypoint at the east
      # end of row 0 states how long he stands there and which way he faces.
      - when: { enemy: none }
        toward: { path: [{ q: -6, r: 0 }, { q: 2, r: 0, wait: 2, facing: s }, { q: -2, r: 4 }] }
room:
  version: 3
  id: room-1
  name: Pause Facing Site
  coordinateFrame:
    horizontalPlane: world-xz
    verticalAxis: world-y-up
    distanceUnit: world-scene-unit
    hexRadius: 1
    footprintFrame: owner-local-xz
  scene:
    version: 3
    id: scene-1
    name: Pause Facing Site
    items: []
    groups: []
    mapLabels: []
  room:
    implicitRegionId: room-1-region
    regions:
      - id: room-1-region
        name: Pause Facing Site
        lighting: { intensity: 1 }
        cells: []
      - id: region-hall
        name: Hall
        lighting: { intensity: 1 }
        cells:
          - r: -4
            q: [[-6, 9]]
          - r: -3
            q: [[-6, 9]]
          - r: -2
            q: [[-7, 8]]
          - r: -1
            q: [[-7, 8]]
          - r: 0
            q: [[-8, 7]]
          - r: 1
            q: [[-8, 7]]
          - r: 2
            q: [[-9, 6]]
          - r: 3
            q: [[-9, 6]]
          - r: 4
            q: [[-10, 5]]
          - r: 5
            q: [[-10, 5]]
          - r: 6
            q: [[-11, 4]]
    propDeclarations: {}
    arrangementDeclarations: {}
    monsterDeclarations:
      - id: guard
        ref: dnd5e:monsters:guard
        startingCell:
          location:
            q: -6
            r: 0
    partyStart:
      q: 0
      r: 6
    monsterBindings:
      guard:
        faction: watch
        table: pacing
