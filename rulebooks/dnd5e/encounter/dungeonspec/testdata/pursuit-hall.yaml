# THE PURSUIT HALL (rpg-project#671, smarter monsters S4b): one long hall
# and one guard who runs. Written by hand in the shape the encounter studio's
# encoder exports (exportDraftYaml), the cone site's shape, plus the root
# `bundles:` and `tables:` keys a v4 document declares; no studio export was
# run for it.
#
#   hall    axial q -10..10, rows r 0..1, no wall: the party start at q -10,
#           r 0.
#   guard   at q 4, r 0, fourteen cells down the hall: not even a run reaches
#           the party start this turn. Its table is the castle's `dasher`
#           bundle: swing in reach, walk within one run of reach, run beyond
#           it — so it runs twelve cells, then walks up and swings.
#
# pursuit_hall_site_test.go plays it.
version: 5
key: pursuit-hall
play:
  void: transparent
  lighting: bright
  standing: centre-covered
factions:
  - id: watch
dispositions:
  - between:
      - watch
      - party
    stance: hostile
bundles:
  # Close on the nearest foe at the pace the gap needs: the swing in reach,
  # a walk within one run of reach, and a run only while it gains a round.
  dasher:
    rows:
      - when: { enemy: reach }
        attack: enemy
      - when: { enemy: walk }
        toward: enemy
      - when: { enemy: dash }
        toward: enemy
      - when: { enemy: far }
        dash: enemy
tables:
  runs-them-down:
    time:
      - use: dasher
      - hold: {}
room:
  version: 3
  id: room-1
  name: Pursuit Hall
  coordinateFrame:
    horizontalPlane: world-xz
    verticalAxis: world-y-up
    distanceUnit: world-scene-unit
    hexRadius: 1
    footprintFrame: owner-local-xz
  scene:
    version: 3
    id: scene-1
    name: Pursuit Hall
    items: []
    groups: []
    mapLabels: []
  room:
    implicitRegionId: room-1-region
    regions:
      - id: room-1-region
        name: Pursuit Hall
        lighting: { intensity: 1 }
        cells: []
      - id: region-hall
        name: Hall
        lighting: { intensity: 1 }
        cells:
          - r: 0
            q: [[-10, 10]]
          - r: 1
            q: [[-10, 10]]
    propDeclarations: {}
    arrangementDeclarations: {}
    monsterDeclarations:
      - id: guard
        ref: dnd5e:monsters:guard
        startingCell:
          location:
            q: 4
            r: 0
          facing: w
    partyStart:
      q: -10
      r: 0
    monsterBindings:
      guard:
        faction: watch
        table: runs-them-down
