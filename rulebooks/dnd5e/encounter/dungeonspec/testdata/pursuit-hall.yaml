# THE PURSUIT HALL (rpg-project#671, smarter monsters S4b): one long hall
# and one guard who runs. Written by hand in the shape the encounter studio's
# encoder exports (exportDraftYaml), the cone site's shape, plus the root
# `bundles:` and `tables:` keys a v4 document declares; no studio export was
# run for it.
#
#   hall    axial q -10..10, rows r 0..1, no wall: the party start at q -10,
#           r 0.
#   guard   at q 3, r 0, thirteen cells down the hall: a walk cannot reach the
#           party start this turn and a run can. Its table is the `dasher`
#           bundle: swing in reach, walk when a walk gets there, run when only
#           a run does.
#
# pursuit_hall_site_test.go plays it.
version: 4
key: pursuit-hall
play:
  void: transparent
  lighting: bright
  standing: centre-covered
factions:
  - id: watch
dispositions:
  - between:
      - watch
      - party
    stance: hostile
bundles:
  # Close on the nearest foe at the pace the gap needs: the swing when they
  # are in reach, a walk when a walk gets there, a run when only a run does.
  dasher:
    rows:
      - when: { enemy: reach }
        attack: enemy
      - when: { enemy: walk }
        toward: enemy
      - when: { enemy: dash }
        dash: enemy
tables:
  runs-them-down:
    time:
      - use: dasher
      - hold: {}
