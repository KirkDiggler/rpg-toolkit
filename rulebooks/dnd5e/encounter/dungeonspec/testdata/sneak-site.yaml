# THE SNEAK SITE (rpg-project#606, sneaking Task S1): two rooms and a
# doorway, authored in the encounter studio and exported through its own
# encoder (exportDraftYaml, the studio's "download draft"), cut down from the
# facing site's export script. No hand edits below this header.
#
#   near room  offset cols -8..-1, rows -3..3: the party start in its
#              north-west, the cook (a civil commoner) in its south-west.
#   far room   offset cols 0..7, rows -3..3, behind one wall on the hex
#              boundary between them, open only at row 0: the doorway.
#   knight     paces a five-waypoint loop in the far room, hostile to the
#              party.
#
# sneak_site_test.go plays it.
version: 4
key: sneak-site
play:
  void: transparent
  lighting: bright
  standing: centre-covered
factions:
  - id: keep
  - id: kitchen
dispositions:
  - between:
      - keep
      - party
    stance: hostile
  - between:
      - kitchen
      - party
    stance: neutral
  - between:
      - keep
      - kitchen
    stance: neutral
