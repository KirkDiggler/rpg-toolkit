# THE SNEAK SITE (rpg-project#606, sneaking Task S1): two rooms and a
# doorway, authored in the encounter studio and exported through its own
# encoder (exportDraftYaml, the studio's "download draft"), cut down from the
# facing site's export script. No hand edits below this header.
#
#   near room  offset cols -8..-1, rows -3..3: the party start in its
#              north-west, the cook (a civil commoner) in its south-west.
#   far room   offset cols 0..7, rows -3..3, behind one wall on the hex
#              boundary between them, open only at row 0: the doorway.
#   knight     paces a five-waypoint loop in the far room, hostile to the
#              party.
#
# sneak_site_test.go plays it.
version: 5
key: sneak-site
play:
  void: transparent
  lighting: bright
  standing: centre-covered
factions:
  - id: keep
  - id: kitchen
dispositions:
  - between:
      - keep
      - party
    stance: hostile
  - between:
      - kitchen
      - party
    stance: neutral
  - between:
      - keep
      - kitchen
    stance: neutral
room:
  version: 3
  id: room-1
  name: Sneak Site
  coordinateFrame:
    horizontalPlane: world-xz
    verticalAxis: world-y-up
    distanceUnit: world-scene-unit
    hexRadius: 1
    footprintFrame: owner-local-xz
  scene:
    version: 3
    id: scene-1
    name: Sneak Site
    items: []
    groups: []
    mapLabels: []
  room:
    implicitRegionId: room-1-region
    walls:
      - id: doorway-wall
        label: doorway-wall
        line:
          start:
            x: -0.4330127018922193
            z: -5.25
          end:
            x: -0.4330127018922193
            z: 5.25
        appearance:
          assetRef: dnd5e:env:dark-fortress:45_wall_01
          height: 3
          thickness: 0.3
          elevation: 0
        blocker:
          blocksMovement: true
          blocksLineOfSight: true
          footprint:
            width: 10.5
            depth: 0.5
            offsetX: 0
            offsetZ: 0
        openings:
          - id: doorway
            position: 5.25
            width: 2
    regions:
      - id: room-1-region
        name: Sneak Site
        lighting: { intensity: 1 }
        cells: []
      - id: region-near-room
        name: Near room
        lighting: { intensity: 1 }
        cells:
          - r: -3
            q: [[-6, 1]]
          - r: -2
            q: [[-7, 0]]
          - r: -1
            q: [[-7, 0]]
          - r: 0
            q: [[-8, -1]]
          - r: 1
            q: [[-8, -1]]
          - r: 2
            q: [[-9, -2]]
          - r: 3
            q: [[-9, -2]]
      - id: region-far-room
        name: Far room
        lighting: { intensity: 1 }
        cells:
          - r: -3
            q: [[2, 9]]
          - r: -2
            q: [[1, 8]]
          - r: -1
            q: [[1, 8]]
          - r: 0
            q: [[0, 7]]
          - r: 1
            q: [[0, 7]]
          - r: 2
            q: [[-1, 6]]
          - r: 3
            q: [[-1, 6]]
    propDeclarations: {}
    arrangementDeclarations: {}
    monsterDeclarations:
      - id: knight
        ref: dnd5e:monsters:knight
        startingCell:
          location:
            q: 5
            r: 0
      - id: cook
        ref: dnd5e:monsters:commoner
        startingCell:
          location:
            q: -8
            r: 3
    partyStart:
      q: -6
      r: -2
    monsterBindings:
      knight:
        faction: keep
        on:
          time:
            - when:
                enemy: reach
              attack: enemy
            - when:
                enemy: seen
              toward: enemy
            - when:
                enemy: none
              toward:
                path:
                  - q: 5
                    r: 0
                  - q: 4
                    r: 2
                  - q: 2
                    r: 2
                  - q: 4
                    r: -2
                  - q: 6
                    r: -2
      cook:
        faction: kitchen
