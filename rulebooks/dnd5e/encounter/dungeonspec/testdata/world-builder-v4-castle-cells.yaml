# The mad king's cells (rpg-project#569), the first studio-authored room:
# rpg-api's shipped content/the-mad-king-cells.yaml at dev 653555d8, verbatim,
# with the two lines R12 makes expressible added — the cell door teaches
# `cells-opened` when it opens (`doorBindings.<id>.opened`), and the `freed`
# ending waits on that fact. Before R12 a "cells opened" ending could not be
# written: no predicate reads a door, and now the door writes a fact.
version: 5
key: the-mad-king-cells
play:
  void: transparent
  lighting: bright
  standing: centre-covered
templates:
  guard-1:
    base: dnd5e:monsters:human
    name: Prisoner Guard
    armor: dnd5e:armor:chain-mail
    actions:
      - dnd5e:weapons:spear
  prisoner:
    base: dnd5e:monsters:human
    name: Prisoner
    actions:
      - dnd5e:weapons:club
factions:
  - id: garrison
    mind: 7b8b5d1c-1b8f-4ea1-a681-5abab9420d0a
  - id: prisoners
dispositions:
  - between: [garrison, party]
    stance: hostile
    until:
      fact: guard-bribed
  - between: [prisoners, party]
    stance: neutral
intel:
  - id: king-whereabouts
    reveals:
      fact: king-in-great-hall
  - id: key-bearer
    reveals:
      fact: sergeant-holds-keys
tables:
  cell-guard:
    time:
      - when:
          - fact: alarm-raised
          - enemy: reach
        attack: enemy
        weight: 4
      - when:
          - fact: alarm-raised
          - not:
              enemy: reach
        toward: enemy
        weight: 4
      - when:
          heard:
            kind: clang
            within: 2
        say: Steel in the cells! Sound the alarm!
        fact: alarm-raised
        weight: 3
      - when:
          enemy: seen
        say: Intruders in the cells! Sound the alarm!
        fact: alarm-raised
        weight: 3
      - hold: {}
        weight: 1
exits:
  - id: stair-up
    cell:
      q: -11
      r: 5
endings:
  - id: freed
    when:
      fact: cells-opened
