# THE MAD KING'S CASTLE (rpg-project#605; the use case is rpg-project
# ideas/living-world/the-mad-king/use-case.md) — one castle, many ways in,
# two endings, authored as ONE studio document: one file, one run, rooms
# that are regions crossed by walking through doors.
#
# WHERE THE GEOMETRY CAME FROM. Every room, wall, door, label and placement
# below was authored in the encounter studio and written by its draft export
# (rpg-dnd5e-web `exportDraftYaml`, the encoder's exact bytes). The document
# is the studio's S4 castle (`fixtures/castleS4.ts`: the keep's eight rooms,
# walls and doors with the read-back castle's scope), edited with the
# studio's own document verbs: the populated fixture underneath it (the
# goblin front room, its props, wall and scope) removed, the floor erased
# down to the eight rooms, the gate and throne walls drawn wider so each
# door is its room's only way in, the captain moved to the gate, and the keep's
# cast, bindings, stat blocks, tables, factions and endings authored. The
# only hand edits are these comments and the patrol and march rows
# (`toward: { path }`, `toward: { at }`, marked "Hand edit"), which the
# studio's table form does not offer yet. After the first walk the export
# also gives the captain a soldier's look (the fixture dressed him as the
# king), drops the workspace's two stray map labels that sat in no room, and
# draws the castle's outer walls: twelve wall lines along the eight rooms'
# outer edges, no openings, so the gate door is the gatehouse's only view as
# well as its only way in. Two partitions carry the hall wall's line on to
# the keep's sides, so the kitchen and chapel no longer open on the barracks
# and armoury, and the kitchen and chapel walls stand on the hex boundaries
# between their rooms rather than on edge cells. Every room with a
# door is entered only through it; the barracks and armoury stay open to the
# courtyard. The void stays transparent, the only value this dialect accepts;
# the walls, not the void, close the rooms. The king sits in the throne
# room's west corner beside the door wall, and each knight has its own table
# and paces its own side of the room, clear of the throne door's line.
#
# ONE CASTLE (rpg-project#611). The castle is the only castle entry, so the
# cells and the kitchen's trigger fold into it, still by the export. The
# south front is cut four rows north (the courtyard, barracks and armoury
# end at row 6, the gatehouse is rows 7..12) so the courtyard, 29 x 13, fits
# the play view; the gate, the gate guards, their loop, the captain, the
# party start and the postern move north with it. The cells
# (the-mad-king-cells) are a ninth room, a 12 x 8 block below the barracks
# whose one door is in the barracks' south wall; its sergeant, its turnkey
# and four prisoners are the one-off's, the guards in the garrison keeping
# the door from the barracks side and the prisoners their own faction. The
# one-off's bribe (the sergeant's purse line, `guard-bribed`) is not
# carried: it turned a hostile garrison civil, and this garrison starts
# civil. It is an authoring hook for a cells guard who starts hostile. The kitchen gains castle-kitchen's second
# hand, a scullion, and its trigger: the captain's orders on the kitchen
# floor. The one-offs stay in testdata as their own tests' content.
#
# THE CASTLE. The garrison keeps the gate and the hall, and its mind is the
# captain: it is civil to the party until the party is recognized, and civil
# to the loyalists until the guards turn. The loyalists (the king, his
# knights, the reserves in the barracks) are hostile to the party always.
# The kitchen is civil and stays civil. One fact is learned in the kitchen
# and spent at the gate — the cook's gossip opens the troupe, and Ashford
# opens the turn. The captain's orders on the kitchen floor say the party is
# not who it claims: carry them into the captain's presence and the garrison
# knows it (`party-recognized`, the garrison's `until`). The prisoners are
# neutral to everybody. Every door is shut, the throne room's too, and one
# is locked: the cell door, thieves' tools at DC 13, whose opening teaches
# `cells-opened` and ends the run `freed`. A shut throne door stops a turned
# garrison's march at it, because a driven walk routes only through open
# doors and no creature opens one (rpg-toolkit#2069); the party opens it. A
# turned garrison storms the keep; a garrison told to hold the castle ends
# the run with the king still breathing.
#
# THE ROUTES, each a scenario test in dungeonspec/castle_king_*_test.go:
# the front door, the troupe, the troupe blown, turning the garrison, the
# king deposed, the king slain, the scout who talks to the wrong guard, the
# cell lock picked, and the orders carried to the captain.
# THE KITCHEN-DOOR ROUTES (rpg-project#606, sneaking S1). The kitchen's one
# door into the great hall is LOCKED: thieves' tools at DC 13 pick it
# silently, Strength at DC 15 forces it and crashes. The hall guard walks a
# loop across the great hall between the kitchen door and the throne door.
# A party that declares sneaking in the kitchen, picks the door and crosses
# the hall past him reaches the throne door unseen
# (castle_king_kitchen_test.go). Every other route out of the kitchen picks
# the lock first.
#
# STATED FACINGS (rpg-project#623). A watcher's cone points where it faces,
# and an unstated facing is south (180), so every creature that stands still
# states the compass word that points it at what it keeps, nearest the
# bearing from its cell to that cell: the cook looks at the kitchen door (e,
# 90), the scullion into the kitchen (ne; its centre is at 53), the captain
# down the gatehouse at whoever comes to the gate (s, the party start), the
# turnkey and the sergeant at the cells door (w, 251; se, 120), the king at
# the throne door (e, 90). The facings are test choices, not story. Creatures that walk a route face their steps; the gate
# guards' pause facings are rpg-project#624's. castle_king_facings_test.go
# holds each cone over the cell it keeps.
#
# STORED IS AUTHORED. Each stat block under `templates:` says scores, hit
# dice, armor, proficiency, skills and weapons — never hit points, armor
# class or an attack bonus, which are the rulebook's to derive. The guard
# and the captain are the castle kitchen's numbers; the cells' guards are
# guards, and the prisoner is the cells' own.
version: 4
key: the-mad-king
play:
  void: transparent
  lighting: bright
  standing: centre-covered
templates:
  guard:
    base: dnd5e:monsters:human
    name: Guard
    hitDice: 2d8
    armor: dnd5e:armor:chain-shirt
    abilities:
      str: 13
      con: 12
      wis: 11
    skills:
      - perception
    actions:
      - dnd5e:weapons:spear
  guard-captain:
    base: dnd5e:monsters:human
    name: Guard Captain
    hitDice: 10d8
    armor: dnd5e:armor:breastplate
    abilities:
      str: 15
      dex: 14
      con: 14
      cha: 14
    proficiency: 3
    actions:
      - dnd5e:weapons:longsword
      - dnd5e:weapons:javelin
  commoner:
    base: dnd5e:monsters:human
    name: Commoner
    hitDice: 1d8
    actions:
      - dnd5e:weapons:club
  knight:
    base: dnd5e:monsters:human
    name: Knight
    hitDice: 8d8
    armor: dnd5e:armor:plate
    abilities:
      str: 16
      dex: 11
      con: 14
      wis: 11
      cha: 15
    proficiency: 2
    actions:
      - dnd5e:weapons:greatsword
  mad-king:
    base: dnd5e:monsters:human
    name: The Mad King
    hitDice: 9d8
    armor: dnd5e:armor:breastplate
    abilities:
      str: 14
      dex: 12
      con: 14
      int: 12
      wis: 10
      cha: 16
    proficiency: 2
    actions:
      - dnd5e:weapons:longsword
  prisoner:
    base: dnd5e:monsters:human
    name: Prisoner
    actions:
      - dnd5e:weapons:club
tables:
  gate-patrol:
    time:
      # Hand edit: a gate guard who witnessed the turn marches with the
      # captain, on storm-the-keep's own row.
      - when: [{ fact: guards-turned }, { enemy: none }]
        toward: { at: { q: 10, r: -19 } }
      - say: To arms! Intruders at the gate!
        when:
          - enemy: seen
          - not:
              fact: alarm-raised
        fact: alarm-raised
      - when:
          enemy: reach
        attack: enemy
      - when:
          enemy: seen
        toward: enemy
      - when:
          heard:
            kind: clang
            within: 2
        toward: sound
      # Hand edit: the gate guards pace the gatehouse, a right-angled loop
      # whose legs never share a cell (use case R7). At each gate-side
      # corner a guard stands two rounds turned inward to the party start,
      # watching the incomers (rpg-project#624): se from the west corner,
      # sw from the east.
      - when: { enemy: none }
        toward: { path: [{ q: -7, r: 9, wait: 2, facing: se }, { q: -1, r: 9, wait: 2, facing: sw }, { q: -3, r: 12 }, { q: -9, r: 12 }] }
  keep-patrol:
    time:
      - say: Protect the king!
        when:
          - enemy: seen
          - not:
              fact: alarm-raised
        fact: alarm-raised
      - when:
          enemy: reach
        attack: enemy
      - when:
          enemy: seen
        toward: enemy
      # Hand edit: on the alarm, fall back beside the king, in his corner.
      - when: { fact: alarm-raised }
        toward: { at: { q: 4, r: -18 } }
      - when:
          heard:
            kind: voice
            within: 3
        toward: sound
      # Hand edit: this knight paces the throne room's west side, a loop that
      # stays clear of the throne door's line from the hall.
      - when: { enemy: none }
        toward: { path: [{ q: 4, r: -19 }, { q: 7, r: -19 }, { q: 7, r: -21 }, { q: 5, r: -21 }] }
  keep-patrol-east:
    time:
      - say: Protect the king!
        when:
          - enemy: seen
          - not:
              fact: alarm-raised
        fact: alarm-raised
      - when:
          enemy: reach
        attack: enemy
      - when:
          enemy: seen
        toward: enemy
      # Hand edit: on the alarm, fall back beside the king, in his corner.
      - when: { fact: alarm-raised }
        toward: { at: { q: 4, r: -18 } }
      - when:
          heard:
            kind: voice
            within: 3
        toward: sound
      # Hand edit: this knight paces the throne room's east side, a loop that
      # stays clear of the throne door's line from the hall.
      - when: { enemy: none }
        toward: { path: [{ q: 13, r: -19 }, { q: 16, r: -19 }, { q: 16, r: -21 }, { q: 14, r: -21 }] }
  cell-guard:
    time:
      - weight: 4
        when:
          - fact: alarm-raised
          - enemy: reach
        attack: enemy
      - weight: 4
        when:
          - fact: alarm-raised
          - not:
              enemy: reach
        toward: enemy
      - weight: 3
        say: Steel in the cells! Sound the alarm!
        when:
          heard:
            kind: clang
            within: 2
        fact: alarm-raised
      - weight: 3
        say: Intruders in the cells! Sound the alarm!
        when:
          enemy: seen
        fact: alarm-raised
      - weight: 1
        hold: {}
  hall-patrol:
    time:
      # Hand edit: the hall guard is storm-the-keep's soldier when the
      # garrison turns, and until then walks a loop across the great hall
      # between the kitchen door and the throne door (sneaking S1,
      # rpg-project#606): the watcher a party sneaking from the kitchen to the
      # throne room has to get past.
      - when: [{ fact: guards-turned }, { enemy: none }]
        toward: { at: { q: 10, r: -19 } }
      - when:
          enemy: reach
        attack: enemy
      - when:
          enemy: seen
        toward: enemy
      - when: { enemy: none }
        toward: { path: [{ q: -2, r: -12 }, { q: 6, r: -12 }, { q: 6, r: -15 }, { q: 1, r: -15 }] }
  storm-the-keep:
    time:
      # Hand edit: a turned garrison marches on the throne room until it sees
      # a loyalist (use case R8's list form). `enemy: none`, not `not: { enemy:
      # seen }`: the bands are exclusive (R11), so an enemy in reach is not
      # "seen", and the negation would march a captain past the knight
      # swinging at him.
      - when: [{ fact: guards-turned }, { enemy: none }]
        toward: { at: { q: 10, r: -19 } }
      - when:
          enemy: reach
        attack: enemy
      - when:
          enemy: seen
        toward: enemy
factions:
  - id: garrison
    mind: captain
    temper:
      soldier: 2
      coward: 1
  - id: loyalists
    mind: king
    temper: aggressive
  - id: kitchen
    mind: cook
  - id: prisoners
dispositions:
  - between:
      - garrison
      - party
    stance: neutral
    until:
      fact: party-recognized
  - between:
      - loyalists
      - party
    stance: hostile
  - between:
      - garrison
      - loyalists
    stance: neutral
    until:
      fact: guards-turned
  - between:
      - kitchen
      - party
    stance: neutral
  - between:
      - prisoners
      - party
    stance: neutral
intel:
  - id: cooks-ledger
    reveals:
      fact: king-burned-village
  - id: captains-orders
    reveals:
      fact: party-recognized
  - id: king-whereabouts
    reveals:
      fact: king-in-throne-room
  - id: key-bearer
    reveals:
      fact: sergeant-holds-keys
exits:
  - id: postern
    cell:
      q: -22
      r: 5
endings:
  - id: king-slain
    when:
      down: king
  - id: king-deposed
    when:
      fact: throne-taken
  - id: freed
    when:
      fact: cells-opened
