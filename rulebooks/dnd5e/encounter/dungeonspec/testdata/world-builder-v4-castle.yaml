    doorBindings:
      gate-wall-door:
        closed: true
      hall-wall-door:
        closed: true
      kitchen-wall-door:
        closed: true
        # Hand edit (sneaking S1, rpg-project#606): the use case's forced
        # door. Picked with thieves' tools, it opens silently; forced with
        # Strength, it crashes.
        locked:
          - ability: str
            dc: 15
          - ability: dex
            tool: dnd5e:item:thieves-tools
            dc: 13
