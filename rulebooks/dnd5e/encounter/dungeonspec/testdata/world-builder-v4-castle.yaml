# THE MAD KING'S CASTLE (rpg-project#605; the use case is rpg-project
# ideas/living-world/the-mad-king/use-case.md) — one castle, many ways in,
# two endings, authored as ONE studio document: one file, one run, rooms
# that are regions crossed by walking through doors.
#
# WHERE THE GEOMETRY CAME FROM. Every room, wall, door, label and placement
# below was authored in the encounter studio and written by its draft export
# (rpg-dnd5e-web `exportDraftYaml`, the encoder's exact bytes). The document
# is the studio's S4 castle (`fixtures/castleS4.ts`: the keep's eight rooms,
# walls and doors with the read-back castle's scope), edited with the
# studio's own document verbs: the populated fixture underneath it (the
# goblin front room, its props, wall and scope) removed, the floor erased
# down to the eight rooms, the captain moved to the gate, and the keep's
# cast, bindings, stat blocks, tables, factions and endings authored. The
# only hand edits are these comments and the patrol and march rows
# (`toward: { path }`, `toward: { at }`), which the studio's table form does
# not offer in this dialect yet.
#
# THE CASTLE. The garrison keeps the gate and the hall, and its mind is the
# captain: it is civil to the party until the party is recognized, and civil
# to the loyalists until the guards turn. The loyalists (the king, his
# knights, the reserves in the barracks) are hostile to the party always.
# The kitchen is civil and stays civil. One fact is learned in the kitchen
# and spent at the gate — the cook's gossip opens the troupe, and Ashford
# opens the turn. The throne room's doors stand open; every other door is
# shut. A turned garrison storms the keep; a garrison told to hold the
# castle ends the run with the king still breathing.
#
# THE ROUTES, each a scenario test in dungeonspec/castle_king_*_test.go:
# the front door, the troupe, the troupe blown, turning the garrison, the
# king deposed, the king slain, and the scout who talks to the wrong guard.
# THE KITCHEN-DOOR ROUTES (sneaking past the keep patrol, and the forced
# door the knights hear) wait on wave C (rpg-project#606).
#
# STORED IS AUTHORED. Each stat block under `templates:` says scores, hit
# dice, armor, proficiency, skills and weapons — never hit points, armor
# class or an attack bonus, which are the rulebook's to derive. The guard
# and the captain are the castle kitchen's numbers.
version: 4
key: the-mad-king
play:
  void: transparent
  lighting: bright
  standing: centre-covered
templates:
  guard:
    base: dnd5e:monsters:human
    name: Guard
    hitDice: 2d8
    armor: dnd5e:armor:chain-shirt
    abilities:
      str: 13
      con: 12
      wis: 11
    skills:
      - perception
    actions:
      - dnd5e:weapons:spear
  guard-captain:
    base: dnd5e:monsters:human
    name: Guard Captain
    hitDice: 10d8
    armor: dnd5e:armor:breastplate
    abilities:
      str: 15
      dex: 14
      con: 14
      cha: 14
    proficiency: 3
    actions:
      - dnd5e:weapons:longsword
      - dnd5e:weapons:javelin
  commoner:
    base: dnd5e:monsters:human
    name: Commoner
    hitDice: 1d8
    actions:
      - dnd5e:weapons:club
  knight:
    base: dnd5e:monsters:human
    name: Knight
    hitDice: 8d8
    armor: dnd5e:armor:plate
    abilities:
      str: 16
      dex: 11
      con: 14
      wis: 11
      cha: 15
    proficiency: 2
    actions:
      - dnd5e:weapons:greatsword
  mad-king:
    base: dnd5e:monsters:human
    name: The Mad King
    hitDice: 9d8
    armor: dnd5e:armor:breastplate
    abilities:
      str: 14
      dex: 12
      con: 14
      int: 12
      wis: 10
      cha: 16
    proficiency: 2
    actions:
      - dnd5e:weapons:longsword
tables:
  gate-patrol:
    time:
      - say: To arms! Intruders at the gate!
        when:
          - enemy: seen
          - not:
              fact: alarm-raised
        fact: alarm-raised
      - when:
          enemy: reach
        attack: enemy
      - when:
          enemy: seen
        toward: enemy
      - when:
          heard:
            kind: clang
            within: 2
        toward: sound
  keep-patrol:
    time:
      - say: Protect the king!
        when:
          - enemy: seen
          - not:
              fact: alarm-raised
        fact: alarm-raised
      - when:
          enemy: reach
        attack: enemy
      - when:
          enemy: seen
        toward: enemy
      - when:
          heard:
            kind: voice
            within: 3
        toward: sound
  storm-the-keep:
    time:
      - when:
          enemy: reach
        attack: enemy
      - when:
          enemy: seen
        toward: enemy
factions:
  - id: garrison
    mind: captain
    temper:
      soldier: 2
      coward: 1
  - id: loyalists
    mind: king
    temper: aggressive
  - id: kitchen
    mind: cook
dispositions:
  - between:
      - garrison
      - party
    stance: neutral
    until:
      fact: party-recognized
  - between:
      - loyalists
      - party
    stance: hostile
  - between:
      - garrison
      - loyalists
    stance: neutral
    until:
      fact: guards-turned
  - between:
      - kitchen
      - party
    stance: neutral
intel:
  - id: cooks-ledger
    reveals:
      fact: king-burned-village
exits:
  - id: postern
    cell:
      q: -24
      r: 9
endings:
  - id: king-slain
    when:
      down: king
  - id: king-deposed
    when:
      fact: throne-taken
