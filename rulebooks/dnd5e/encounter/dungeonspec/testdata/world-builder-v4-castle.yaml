    monsterBindings:
      gate-1:
        faction: garrison
        table: gate-patrol
      gate-2:
        faction: garrison
        table: gate-patrol-east
      hall-1:
        faction: garrison
        table: hall-patrol
      captain:
        faction: garrison
        table: storm-the-keep
        options:
          - id: troupe
            say: We’re the troupe for tonight’s feast.
            check:
              - ability: performance
                dc: 13
              - ability: deception
                dc: 15
            requires:
              fact: feast-tonight
            success:
              - say: Through to the hall, then. Don’t dawdle.
            failure:
              - say: Troupe? There’s no— GUARDS!
                fact: party-recognized
          - id: stand-aside
            say: Stand aside or bleed.
            check:
              - ability: intimidation
                dc: 14
            success:
              - weight: 3
                say: …go on, then. I saw nothing.
                fact: gate-cowed
              - weight: 1
                say: Big words. GUARDS!
                fact: party-recognized
            failure:
              - say: You’ll bleed first.
                fact: party-recognized
          - id: turn
            say: He burned Ashford. Your own village. You know what he is.
            check:
              - ability: persuasion
                dc: 15
            requires:
              fact: king-burned-village
            success:
              - say: …Gods forgive me. The garrison is yours. We take the keep.
                fact: guards-turned
            failure:
              - say: Lies. Get out before I change my mind.
          - id: hold-the-castle
            say: Hold the gate. Let no one in or out until it’s done.
            check:
              - ability: persuasion
                dc: 10
            requires:
              fact: guards-turned
            success:
              - say: Done. Go finish it.
                fact: throne-taken
            failure:
              - say: We’ll hold what we can.
      # A FAILED THEFT CLOSES THE KITCHEN, NOT THE KEEP (rpg-project#719):
      # the pilfer's failure teaches `caught-in-kitchen` to whoever saw it,
      # and the cook's theft and gossip are withheld from a speaker who knows
      # it (D3: the speaker's knowledge). Ashford and the bribe already have
      # a requirement each, and a requires is one predicate, so they stay.
      cook:
        faction: kitchen
        options:
          - id: pilfer
            say: (lift a pie from the sill)
            check:
              - ability: sleight-of-hand
                dc: 13
            requires:
              not:
                fact: caught-in-kitchen
            success:
              - say: The cook never looks round.
            failure:
              - say: Thief!
                fact: caught-in-kitchen
          - id: gossip
            say: Busy night?
            check:
              - ability: persuasion
                dc: 10
            requires:
              not:
                fact: caught-in-kitchen
            success:
              - say: Feast for the whole court, and him sitting there grinning after what he did
                  to Ashford.
                fact: feast-tonight
            failure:
              - say: Out of my kitchen.
          - id: ashford
            say: What did he do to Ashford?
            check:
              - ability: persuasion
                dc: 12
            requires:
              fact: feast-tonight
            success:
              - say: Burned it. Every house. The captain’s mother was in one.
                fact: king-burned-village
            failure:
              - say: I’ve said too much already.
          - id: bribe
            say: Ten gold says you never saw us.
            check:
              - ability: persuasion
                dc: 8
            requires:
              holds: purse
            success:
              - say: Saw who?
                fact: feast-tonight
            failure:
              - say: Keep your coin.
