# THE MAD KING'S CASTLE (rpg-project#605; the use case is rpg-project
# ideas/living-world/the-mad-king/use-case.md) — one castle, many ways in,
# two endings, authored as ONE studio document: one file, one run, rooms
# that are regions crossed by walking through doors.
#
# WHERE THE GEOMETRY CAME FROM. Every room, wall, door, label and placement
# below was authored in the encounter studio and written by its draft export
# (rpg-dnd5e-web `exportDraftYaml`, the encoder's exact bytes). The document
# is the studio's S4 castle (`fixtures/castleS4.ts`: the keep's eight rooms,
# walls and doors with the read-back castle's scope), edited with the
# studio's own document verbs: the populated fixture underneath it (the
# goblin front room, its props, wall and scope) removed, the floor erased
# down to the eight rooms, the gate and throne walls drawn wider so each
# door is its room's only way in, the captain moved to the gate, and the keep's
# cast, bindings, stat blocks, tables, factions and endings authored. The
# only hand edits are these comments and the patrol and march rows
# (`toward: { path }`, `toward: { at }`, marked "Hand edit"), which the
# studio's table form does not offer yet. After the first walk the export
# also gives the captain a soldier's look (the fixture dressed him as the
# king), drops the workspace's two stray map labels that sat in no room, and
# draws the castle's outer walls: twelve wall lines along the eight rooms'
# outer edges, no openings, so the gate door is the gatehouse's only view as
# well as its only way in. Two partitions carry the hall wall's line on to
# the keep's sides, so the kitchen and chapel no longer open on the barracks
# and armoury, and the kitchen and chapel walls stand on the hex boundaries
# between their rooms rather than on edge cells. Every room with a
# door is entered only through it; the barracks and armoury stay open to the
# courtyard. The void stays transparent, the only value this dialect accepts;
# the walls, not the void, close the rooms. The king sits in the throne
# room's west corner beside the door wall, and each knight has its own table
# and paces its own side of the room, clear of the throne door's line.
#
# ONE CASTLE (rpg-project#611). The castle is the only castle entry, so the
# cells and the kitchen's trigger fold into it, still by the export. The
# south front is cut four rows north (the courtyard, barracks and armoury
# end at row 6, the gatehouse is rows 7..12) so the courtyard, 29 x 13, fits
# the play view; the gate, the gate guards, their loop, the captain, the
# party start and the postern move north with it. The cells
# (the-mad-king-cells) are a ninth room, a 12 x 8 block below the barracks
# whose one door is in the barracks' south wall; its sergeant, its turnkey
# and four prisoners are the one-off's, the guards in the garrison keeping
# the door from the barracks side and the prisoners their own faction. The
# one-off's bribe (the sergeant's purse line, `guard-bribed`) is not
# carried: it turned a hostile garrison civil, and this garrison starts
# civil. It is an authoring hook for a cells guard who starts hostile. The kitchen gains castle-kitchen's second
# hand, a scullion, and its trigger: the captain's orders on the kitchen
# floor. The one-offs stay in testdata as their own tests' content.
#
# THE CASTLE. The garrison keeps the gate and the hall, and its mind is the
# captain: it is civil to the party until the party is recognized, and the
# party's side once the guards turn; civil to the loyalists until the guards
# turn. THE CAPTAIN'S WORD OUTRANKS RECOGNITION (rpg-project#717): the
# garrison's `until` is a list, `guards-turned` first, so a party recognized
# and then turned is allied, and a party turned and then recognized stays
# allied. The loyalists (the king and his
# knights) are hostile to the party always.
# The kitchen is civil and stays civil. One fact is learned in the kitchen
# and spent at the gate — the cook's gossip opens the troupe, and Ashford
# opens the turn. The captain's orders on the kitchen floor say the party is
# not who it claims: carry them into the captain's presence and the garrison
# knows it (`party-recognized`, the second step of the garrison's `until`). The prisoners are
# neutral to everybody. Every door is shut, the throne room's too, and one
# is locked: the cell door, thieves' tools at DC 13, whose opening teaches
# `cells-opened`, and walking out of the front door after it ends the run
# `freed`. A creature walking into a shut, unlocked door opens it on its way
# (rpg-project#715), so a turned garrison storms the keep through the shut
# throne door, and its captain comes with the party (`toward: ally`,
# rpg-project#717); a locked door still stops a march. A garrison told to
# hold the castle, and the party walking out of the front door, ends the run
# with the king still breathing.
#
# THE ROUTES, each a scenario test in dungeonspec/castle_king_*_test.go:
# the front door, the troupe (by the cook or by the stranger), the troupe
# blown, turning the garrison, the king deposed, the king slain, the scout
# who talks to the wrong guard, the cell lock picked, and the orders carried
# to the captain.
# THE KITCHEN-DOOR ROUTES (rpg-project#606, sneaking S1). The kitchen's one
# door into the great hall is LOCKED: thieves' tools at DC 13 pick it
# silently, Strength at DC 15 forces it and crashes. The hall guard walks a
# loop across the great hall between the kitchen door and the throne door.
# A party that declares sneaking in the kitchen, picks the door and crosses
# the hall past him reaches the throne door unseen
# (castle_king_kitchen_test.go). Every other route out of the kitchen picks
# the lock first.
#
# STATED FACINGS (rpg-project#623). A watcher's cone points where it faces,
# and an unstated facing is south (180), so every creature that stands still
# states the compass word that points it at what it keeps, nearest the
# bearing from its cell to that cell: the cook looks at the kitchen door (e,
# 90), the scullion into the kitchen (ne; its centre is at 53), the captain
# down the gatehouse at whoever comes to the gate (s, the south doorway), the
# turnkey and the sergeant at the cells door (w, 251; se, 120), the king at
# the throne door (e, 90), the pedlar at the party start two cells off (sw). The facings are test choices, not story. Creatures that walk a route face their steps; the gate
# guards' pause facings are rpg-project#624's. castle_king_facings_test.go
# holds each cone over the cell it keeps.
#
# THE QA CASTLE (rpg-project#639). The castle is also the standing QA
# script, and these pieces stage its steps, each a test in
# dungeonspec/castle_king_script_test.go. The party starts outside, with the
# garrison civil, on open ground round the gatehouse whose one way into the
# castle is a doorway in the gatehouse's south wall: the operator's own
# layout (rpg-project#654), its cells, doorway and party start folded in
# from the studio. On the start's side, two cells from the party start and
# out of the gate's sight, stands a stranger, the pedlar (townsfolk, civil),
# placed where the party sees him at once (the QA castle is a checklist, not
# a search; rpg-project#654), whose
# one line teaches `feast-tonight` win or lose, so the captain's troupe
# line is offered. Without it, a party that walks in civil and declares
# sneaking behind the corner wall inside the gate, unseen, crosses to the gate
# while both gate guards stand at their beat posts and is rolled against by
# nobody; at their door posts the crossing rolls. Declaring in plain sight
# does nothing (sneaking R10). Fighting the gate guards brings nobody: the
# far room's two guards, the reserves in the barracks, are the garrison's
# and arrive only when the gate opens (`gate-opened`), walking to the gate
# civil on the troupe route and hostile after a fight. These pieces were
# written by hand in the export's own shape, for the operator to open and
# adjust in the studio.
#
# STORED IS AUTHORED. Each stat block under `templates:` says scores, hit
# dice, armor, proficiency, skills and weapons — never hit points, armor
# class or an attack bonus, which are the rulebook's to derive. The guard
# and the captain are the castle kitchen's numbers; the cells' guards are
# guards, and the prisoner is the cells' own.
version: 5
key: the-mad-king
play:
  void: transparent
  lighting: bright
  standing: centre-covered
templates:
  guard:
    base: dnd5e:monsters:human
    name: Guard
    hitDice: 2d8
    armor: dnd5e:armor:chain-shirt
    abilities:
      str: 13
      con: 12
      wis: 11
    skills:
      - perception
    actions:
      - dnd5e:weapons:spear
  guard-captain:
    base: dnd5e:monsters:human
    name: Guard Captain
    hitDice: 10d8
    armor: dnd5e:armor:breastplate
    abilities:
      str: 15
      dex: 14
      con: 14
      cha: 14
    proficiency: 3
    actions:
      - dnd5e:weapons:longsword
      - dnd5e:weapons:javelin
  commoner:
    base: dnd5e:monsters:human
    name: Commoner
    hitDice: 1d8
    actions:
      - dnd5e:weapons:club
  knight:
    base: dnd5e:monsters:human
    name: Knight
    hitDice: 8d8
    armor: dnd5e:armor:plate
    abilities:
      str: 16
      dex: 11
      con: 14
      wis: 11
      cha: 15
    proficiency: 2
    actions:
      - dnd5e:weapons:greatsword
  mad-king:
    base: dnd5e:monsters:human
    name: The Mad King
    hitDice: 9d8
    armor: dnd5e:armor:breastplate
    abilities:
      str: 14
      dex: 12
      con: 14
      int: 12
      wis: 10
      cha: 16
    proficiency: 2
    actions:
      - dnd5e:weapons:longsword
  prisoner:
    base: dnd5e:monsters:human
    name: Prisoner
    actions:
      - dnd5e:weapons:club
# Hand edit (rpg-project#670, S3 bundles): the gate guards' shared
# behaviours, each authored once and used as one line of a table. A `use:`
# row is a group: it takes one share of the roll, and its own rows roll
# inside it. The castle's die is the route host's die of 1, so every level
# picks its first eligible row and the castle plays exactly as it did when
# these rows were written out flat in each table.
bundles:
  # Walk to where you last saw them; when that cell is empty, search on the
  # way they went.
  pursuer:
    params: { distance: 6, heading: went }
    rows:
      - when: { enemy: remembered }
        toward: enemy
      - when: { enemy: lost }
        search: { distance: $distance, heading: $heading }
  # Run to steel being swung nearby.
  alarm-reactor:
    rows:
      - when:
          heard:
            kind: clang
            within: 2
        toward: sound
  # Go for whoever hit you in the last two rounds (rpg-project#669): strike
  # them in reach, walk to them in sight or memory. Each row is on the table
  # only while you hold your attacker so, and the group with it.
  revenger:
    rows:
      - when: { attacked: { within: 2 } }
        attack: attacker
      - when: { attacked: { within: 2 } }
        toward: attacker
  # Hand edit (rpg-project#671, S4 dash; lane #683 D6, D8): close at the
  # pace the gap needs. Strike them in reach; walk when a walk gets you there
  # and still swings. Run only while the run gains a round: inside one run of
  # reach, walk up and swing next round rather than arrive winded beside him.
  # A run spends the swing, so only a guard more than a run away runs.
  dasher:
    rows:
      - when: { enemy: reach }
        attack: enemy
      - when: { enemy: walk }
        toward: enemy
      - when: { enemy: dash }
        toward: enemy
      - when: { enemy: far }
        dash: enemy
  # With nobody to chase, walk the route.
  patrol:
    params: { path: ~ }
    rows:
      - when: { enemy: none }
        toward: { path: $path }
  # Hand edit (rpg-project#670, N2): the base every gate guard starts from,
  # a bundle of bundles. Pursuit, the clang, and the guard's own loop, whose
  # route each guard passes in; `$path` crosses into the patrol one level
  # down. Hand edit (rpg-project#671): the dasher first, and it is the whole
  # approach: a table that uses this base carries no plain `reach` or `seen`
  # rows of its own.
  guard-base:
    params: { path: ~ }
    rows:
      - use: dasher
      # Hand edit (rpg-project#671): the pursuit for a cold trail only; the
      # dasher closes on a memory (answer-the-gate's reason).
      - use: pursuer
        when: { enemy: lost }
      - use: alarm-reactor
      - use: patrol
        with: { path: $path }
tables:
  gate-patrol:
    time:
      # Hand edit: a gate guard who witnessed the turn marches with the
      # captain, on storm-the-keep's own row.
      - when: [{ fact: guards-turned }, { enemy: none }]
        toward: { at: { q: 10, r: -19 } }
      - say: To arms! Intruders at the gate!
        when:
          - enemy: seen
          - not:
              fact: alarm-raised
        fact: alarm-raised
      # Hand edit (rpg-project#671): no plain approach rows here. The base's
      # dasher is the approach: in reach he strikes, within a run he walks
      # up, beyond one he runs. A plain `seen` row beside it would split his
      # roll between walking and running.
      #
      # Hand edit (rpg-project#668, #670): the guard's base, as one line:
      # pursuit (lost from sight, he walks to where he last saw you, then
      # searches six cells on the way you went), the clang he runs to, and
      # his loop home.
      #
      # Hand edit (the QA castle's step 4, rpg-project#639): gate-1's loop.
      # He stands a round at the door post west of the captain turned ne to
      # the cell under the gate, walks to the beat post north of the south
      # doorway and stands a round there turned se to the incomers (#624), and
      # walks back round by the west. gate-patrol-east is its mirror for
      # gate-2, so the two keep step: in two world rounds of every four both
      # stand at their beat posts with their backs to the gate. That is the
      # sneak window. Neither beat post sees round the corner wall.
      - use: guard-base
        with: { path: [{ q: -5, r: 8, wait: 1, facing: ne }, { q: -5, r: 10, wait: 1, facing: se }, { q: -7, r: 10 }] }
  gate-patrol-east:
    time:
      # Hand edit: a gate guard who witnessed the turn marches with the
      # captain, on storm-the-keep's own row.
      - when: [{ fact: guards-turned }, { enemy: none }]
        toward: { at: { q: 10, r: -19 } }
      - say: To arms! Intruders at the gate!
        when:
          - enemy: seen
          - not:
              fact: alarm-raised
        fact: alarm-raised
      # Hand edit (rpg-project#671): no plain approach rows; the base's dasher
      # is the approach, gate-patrol's reason.
      #
      # Hand edit (rpg-project#668, #670): the guard's base, as one line.
      #
      # Hand edit (rpg-project#639): gate-2's loop, gate-patrol's mirror: nw
      # at the door post east of the captain, sw at the beat post.
      - use: guard-base
        with: { path: [{ q: -2, r: 8, wait: 1, facing: nw }, { q: -4, r: 10, wait: 1, facing: sw }, { q: -2, r: 10 }] }
  keep-patrol:
    time:
      # Hand edit (rpg-project#716, Frank's list S2): a knight who SAW the
      # king fall breaks and runs from the fight; one who did not fights
      # on until somebody tells him. Testimony, not a world flag: the row
      # reads the fall this knight holds. `on: ally` because the king is
      # the knight's side, not the knight himself.
      - when: { fell: { who: king, within: 3, on: ally } }
        away: enemy
        weight: 3
      - say: Protect the king!
        when:
          - enemy: seen
          - not:
              fact: alarm-raised
        fact: alarm-raised
      - when:
          enemy: reach
        attack: enemy
      - when:
          enemy: seen
        toward: enemy
      # Hand edit: on the alarm, fall back beside the king, in his corner.
      - when: { fact: alarm-raised }
        toward: { at: { q: 4, r: -18 } }
      - when:
          heard:
            kind: voice
            within: 3
        toward: sound
      # Hand edit: this knight paces the throne room's west side, a loop that
      # stays clear of the throne door's line from the hall.
      - when: { enemy: none }
        toward: { path: [{ q: 4, r: -19 }, { q: 7, r: -19 }, { q: 7, r: -21 }, { q: 5, r: -21 }] }
  keep-patrol-east:
    time:
      # Hand edit (rpg-project#716, Frank's list S2): a knight who SAW the
      # king fall breaks and runs from the fight; one who did not fights
      # on until somebody tells him. Testimony, not a world flag: the row
      # reads the fall this knight holds. `on: ally` because the king is
      # the knight's side, not the knight himself.
      - when: { fell: { who: king, within: 3, on: ally } }
        away: enemy
        weight: 3
      - say: Protect the king!
        when:
          - enemy: seen
          - not:
              fact: alarm-raised
        fact: alarm-raised
      - when:
          enemy: reach
        attack: enemy
      - when:
          enemy: seen
        toward: enemy
      # Hand edit: on the alarm, fall back beside the king, in his corner.
      - when: { fact: alarm-raised }
        toward: { at: { q: 4, r: -18 } }
      - when:
          heard:
            kind: voice
            within: 3
        toward: sound
      # Hand edit: this knight paces the throne room's east side, a loop that
      # stays clear of the throne door's line from the hall.
      - when: { enemy: none }
        toward: { path: [{ q: 13, r: -19 }, { q: 16, r: -19 }, { q: 16, r: -21 }, { q: 14, r: -21 }] }
  cell-guard:
    time:
      - weight: 4
        when:
          - fact: alarm-raised
          - enemy: reach
        attack: enemy
      - weight: 4
        when:
          - fact: alarm-raised
          - not:
              enemy: reach
        toward: enemy
      - weight: 3
        say: Steel in the cells! Sound the alarm!
        when:
          heard:
            kind: clang
            within: 2
        fact: alarm-raised
      - weight: 3
        say: Intruders in the cells! Sound the alarm!
        when:
          enemy: seen
        fact: alarm-raised
      - weight: 1
        hold: {}
  hall-patrol:
    time:
      # Hand edit: the hall guard is storm-the-keep's soldier when the
      # garrison turns, and until then walks a loop across the great hall
      # between the kitchen door and the throne door (sneaking S1,
      # rpg-project#606): the watcher a party sneaking from the kitchen to the
      # throne room has to get past.
      - when: [{ fact: guards-turned }, { enemy: none }]
        toward: { at: { q: 10, r: -19 } }
      - when:
          enemy: reach
        attack: enemy
      - when:
          enemy: seen
        toward: enemy
      - when: { enemy: none }
        toward: { path: [{ q: -2, r: -12 }, { q: 6, r: -12 }, { q: 6, r: -15 }, { q: 1, r: -15 }] }
  storm-the-keep:
    time:
      # Hand edit (smarter monsters S2, rpg-project#669): the captain goes for
      # whoever hit him, past a nearer enemy, as one line. Otherwise the rows
      # below are the fallback, through the roll.
      - use: revenger
      # Hand edit (Frank's list S3, rpg-project#717): a turned captain comes
      # with the party. With no foe in sight he follows the nearest ally, a
      # member of the party once the garrison is the party's side; his own
      # garrison are kin, not allies. The rest of the garrison still marches
      # on the throne room on its own tables. `enemy: none`, not `not: {
      # enemy: seen }`: the bands are exclusive (R11), so an enemy in reach is
      # not "seen", and the negation would walk a captain past the knight
      # swinging at him.
      - when: [{ fact: guards-turned }, { enemy: none }]
        toward: ally
      - when:
          enemy: reach
        attack: enemy
      - when:
          enemy: seen
        toward: enemy
  answer-the-gate:
    time:
      # Hand edit (rpg-project#671): the reserves run to the gate. The dasher
      # is their whole approach, seen or remembered: in reach they strike,
      # within a run they walk up, beyond one they run. No plain `reach` or
      # `seen` row beside it, which would split the roll between walking and
      # running.
      - use: dasher
      # Hand edit (rpg-project#661, #671): the gate guards' pursuit, for a
      # trail gone cold only. A reserve who walked to where he last saw you and
      # found nobody searches six cells on the way you went. While he still
      # remembers you, the dasher closes on the memory, and the pursuer's own
      # walk would only split his roll.
      - use: pursuer
        when: { enemy: lost }
      # Hand edit (the QA castle's step 7, rpg-project#639): the far room
      # answers the gate. Arrived on `gate-opened`, a guard with no enemy in
      # sight walks to the yard two cells in from the gate, so the two who
      # answer do not stand in the gate's one crossing.
      - when: { enemy: none }
        toward: { at: { q: -2, r: 4 } }
factions:
  - id: garrison
    mind: captain
    temper:
      soldier: 2
      coward: 1
  - id: loyalists
    mind: king
    temper: aggressive
    # Hand edit (Frank's list S4, rpg-project#718): the side's lines, spoken
    # by whichever loyalist is addressed, so the court can be talked to once
    # the king has fallen. Ungated: an option's `requires` reads a fact or a
    # holding, and nothing the king's fall teaches is a fact.
    options:
      - id: yield
        say: Yield and live.
        check:
          - ability: persuasion
            dc: 12
        success:
          - say: The king is dead. We yield.
            fact: loyalists-yielded
        failure:
          - say: Never.
      - id: refuse
        say: Die with your king, then.
        check:
          - ability: intimidation
            dc: 15
        failure:
          - say: Then we die fighting.
  - id: kitchen
    mind: cook
  - id: prisoners
  - id: townsfolk
dispositions:
  # The captain's word outranks recognition: the first step that holds wins
  # (rpg-project#717), whichever fact the captain learned first.
  - between:
      - garrison
      - party
    stance: neutral
    until:
      - { fact: guards-turned, then: allied }
      - { fact: party-recognized, then: hostile }
  - between:
      - loyalists
      - party
    stance: hostile
    # Hand edit (Frank's list S4, rpg-project#718): the court stands down when
    # the king falls, so the fight dissolves and the survivors can be spoken
    # to. A blow afterwards turns it hostile again by provocation (D4).
    until:
      down: king
  - between:
      - garrison
      - loyalists
    stance: neutral
    until:
      fact: guards-turned
  - between:
      - kitchen
      - party
    stance: neutral
  - between:
      - prisoners
      - party
    stance: neutral
  - between:
      - townsfolk
      - party
    stance: neutral
intel:
  - id: cooks-ledger
    reveals:
      fact: king-burned-village
  - id: captains-orders
    reveals:
      fact: party-recognized
  - id: king-whereabouts
    reveals:
      fact: king-in-throne-room
  - id: key-bearer
    reveals:
      fact: sergeant-holds-keys
exits:
  - id: postern
    cell:
      q: -22
      r: 5
  # Hand edit (rpg-project#716, ruled 2026-10-29): the party's way in is its
  # way out. "walk out the front door to end. king taken care of? no?
  # failure, yes? success." The last standing party member through this
  # door ends the run; the king's state at that moment is the outcome.
  - id: front-door
    cell:
      q: -2
      r: 16
endings:
  - id: king-slain
    when:
      left: front-door
    if:
      down: king
    outcome: success
  # Hand edit (rpg-project#716, decided 2026-10-29): every ending is at the
  # door. The castle deposed and the cells freed are won when the party
  # walks out with that done, as the king slain is; the first in this list
  # whose `if` holds is the one the run ends on, so a king both slain and
  # deposed ends slain, and walking out with none of it done is the failure.
  - id: king-deposed
    when:
      left: front-door
    if:
      fact: throne-taken
    outcome: success
  - id: freed
    when:
      left: front-door
    if:
      fact: cells-opened
    outcome: success
  - id: king-lives
    when:
      left: front-door
    outcome: failure
room:
  version: 3
  id: room-1
  name: The Mad King’s Castle
  coordinateFrame:
    horizontalPlane: world-xz
    verticalAxis: world-y-up
    distanceUnit: world-scene-unit
    hexRadius: 1
    footprintFrame: owner-local-xz
  scene:
    version: 3
    id: scene-1
    name: The Mad King’s Castle
    items:
      - id: altar
        kind: prop
        assetRef: dnd5e:props:dark-fortress:altar_01
        label: Altar
        transform:
          x: 34.64101615137754
          y: 0
          z: -18
          rotationY: 0.5
      - id: ledger
        kind: prop
        assetRef: dnd5e:props:dark-fortress:book_03
        label: Ledger
        transform:
          x: -38.1051177665153
          y: 0
          z: -15
          rotationY: 0
      - id: purse
        kind: prop
        assetRef: dnd5e:props:fantasy-kingdom:bag_explorer_01
        label: Purse
        transform:
          x: -36.6051177665153
          y: 0
          z: -15
          rotationY: 0
      - id: orders
        kind: prop
        assetRef: dnd5e:props:dark-fortress:letter_01
        label: The Captain’s Orders
        transform:
