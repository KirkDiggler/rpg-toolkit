    partyStart:
      q: -5
      r: 11
    monsterBindings:
      gate-1:
        faction: garrison
        table: gate-patrol
      gate-2:
        faction: garrison
        table: gate-patrol
      hall-1:
        faction: garrison
        table: hall-patrol
      captain:
        faction: garrison
        table: storm-the-keep
        options:
          - id: troupe
            say: We’re the troupe for tonight’s feast.
            check:
              - ability: performance
                dc: 13
              - ability: deception
                dc: 15
            requires:
              fact: feast-tonight
            success:
              - say: Through to the hall, then. Don’t dawdle.
            failure:
              - say: Troupe? There’s no— GUARDS!
                fact: party-recognized
          - id: stand-aside
            say: Stand aside or bleed.
            check:
              - ability: intimidation
                dc: 14
            success:
              - weight: 3
                say: …go on, then. I saw nothing.
                fact: gate-cowed
              - weight: 1
                say: Big words. GUARDS!
                fact: party-recognized
            failure:
              - say: You’ll bleed first.
                fact: party-recognized
          - id: turn
            say: He burned Ashford. Your own village. You know what he is.
            check:
              - ability: persuasion
                dc: 15
            requires:
              fact: king-burned-village
            success:
              - say: …Gods forgive me. The garrison is yours. We take the keep.
                fact: guards-turned
            failure:
              - say: Lies. Get out before I change my mind.
          - id: hold-the-castle
            say: Hold the gate. Let no one in or out until it’s done.
            check:
              - ability: persuasion
                dc: 10
            requires:
              fact: guards-turned
            success:
              - say: Done. Go finish it.
                fact: throne-taken
            failure:
              - say: We’ll hold what we can.
      cook:
        faction: kitchen
        options:
          - id: gossip
            say: Busy night?
            check:
              - ability: persuasion
                dc: 10
            success:
              - say: Feast for the whole court, and him sitting there grinning after what he did
                  to Ashford.
                fact: feast-tonight
            failure:
              - say: Out of my kitchen.
          - id: ashford
            say: What did he do to Ashford?
            check:
              - ability: persuasion
                dc: 12
            requires:
              fact: feast-tonight
            success:
              - say: Burned it. Every house. The captain’s mother was in one.
                fact: king-burned-village
            failure:
              - say: I’ve said too much already.
          - id: bribe
            say: Ten gold says you never saw us.
            check:
              - ability: persuasion
                dc: 8
            requires:
              holds: purse
            success:
              - say: Saw who?
                fact: feast-tonight
            failure:
              - say: Keep your coin.
      keep-1:
        faction: loyalists
        table: keep-patrol
      keep-2:
        faction: loyalists
        table: keep-patrol-east
      king:
        faction: loyalists
      reserve-1:
        faction: loyalists
        table: keep-patrol
        arrives:
          fact: alarm-raised
      reserve-2:
        faction: loyalists
        table: keep-patrol
        arrives:
          fact: alarm-raised
      scullion:
        faction: kitchen
      sergeant:
        faction: garrison
        table: cell-guard
      turnkey:
        faction: garrison
        table: cell-guard
      prisoner-1:
        faction: prisoners
        options:
          - id: where-is-the-king
            say: Where is the king?
            check:
              - ability: persuasion
                dc: 8
            success:
              - say: Through the great hall, in the throne room. He holds court there, mad as a
                  hare.
                fact: king-in-throne-room
            failure:
              - say: Why should I tell you? Get me out first.
          - id: who-holds-the-keys
            say: Who holds the keys?
            check:
              - ability: persuasion
                dc: 10
            success:
              - say: The sergeant, the one on the left. Ring on his belt.
                fact: sergeant-holds-keys
            failure:
              - say: Keys? Nobody tells us anything in here.
