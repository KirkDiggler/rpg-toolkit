# The Wiseman's letter, as the PLACED PROP v4 authors it (rpg-project#488 R1,
# rpg-toolkit#1854) — the same beat testdata/reference-raider-camp.yaml gives
# a legacy prop, authored as a footprint with orders.
#
# THE CLAIM THIS FILE MAKES is compile equivalence with the v2 letter on the
# three keys the fourth declaration kind carries: `holdable`, `holds` and
# `arrives`. prop_bindings_test.go compiles both and requires them equal, the
# record id differing only by each document's own key prefix. Geometry is not
# claimed — v2 puts the letter on cell [1,3] and this dialect gives it a
# rectangle, which is the whole difference between the two spellings.
#
# IT USED TO LIVE IN testdata/decode-only/, because it decoded and could not
# compile: a v4 item compiled to a footprint, and holdable/holds/arrives lived
# only on the legacy prop. rpg-toolkit#1854 gave a placed footprint both, so
# this is now a dungeon this package ships, with a committed picture beside it
# like every other one.
#
# The document is the exact bytes the World Builder emits (rpg-dnd5e-web#1177:
# carry the shape, let the engine grade it).
version: 4
key: raider-letter-v4
play: { void: transparent, lighting: bright, standing: centre-covered }

factions:
  - { id: raiders, mind: chief }
dispositions:
  - { between: [raiders, party], stance: hostile, until: { fact: saved-wiseman } }
intel:
  - { id: wisemans-letter, reveals: { fact: saved-wiseman } }

room:
  version: 3
  id: room-1
  name: The Raider Camp
  coordinateFrame: {horizontalPlane: world-xz, verticalAxis: world-y-up,
    distanceUnit: world-scene-unit, hexRadius: 1,
    footprintFrame: owner-local-xz}
  workspace: { hexRadius: 6, horizontalLimit: 12 }
  scene:
    version: 1
    id: scene-1
    name: The Raider Camp
    items:
      - id: letter
        kind: prop
        assetRef: dnd5e:props:scroll
        label: The Wiseman's Letter
        transform: {x: -1.5, y: 0, z: 0.75, rotationY: 0}
    groups: []
  room:
    implicitRegionId: room-1-region
    walkableHexes: [{q: -2, r: 0}, {q: -2, r: 1}, {q: -2, r: 2},
      {q: -1, r: -1}, {q: -1, r: 0}, {q: -1, r: 1}, {q: -1, r: 2},
      {q: 0, r: -2}, {q: 0, r: -1}, {q: 0, r: 0}, {q: 0, r: 1}, {q: 0, r: 2},
      {q: 1, r: -2}, {q: 1, r: -1}, {q: 1, r: 0}, {q: 1, r: 1},
      {q: 2, r: -2}, {q: 2, r: -1}, {q: 2, r: 0}]
    # A HOLDABLE PROP IS WALKED ONTO TO BE TAKEN, so it blocks nothing —
    # which is what every v2 holdable declares too.
    propDeclarations:
      letter:
        blocksMovement: false
        blocksLineOfSight: false
        footprint: {width: 0.3, depth: 0.3, offsetX: 0, offsetZ: 0}
    arrangementDeclarations: {}
    partyStart: {q: -2, r: 1}
    monsterDeclarations:
      - {id: chief, ref: 'dnd5e:monsters:skeleton-captain', startingCell: { location: { q: 2, r: -1 } }}
    monsterBindings:
      chief: {faction: raiders}
    # THE FOURTH DECLARATION KIND, all three of its keys. The letter is not on
    # the ground when the party comes in: a messenger drops it at the gate
    # when round 6 of a fight starts.
    propBindings:
      letter:
        holdable: true
        holds: [wisemans-letter]
        arrives: { round: 6 }
