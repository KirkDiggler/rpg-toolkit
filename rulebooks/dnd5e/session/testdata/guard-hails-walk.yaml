# THE GUARD HAILS (rpg-project#1139): a small walk site, cut from the
# known-on-sight site, for a creature that hails for itself with no
# conversation. One Guard Captain in a hall, two characters. Nothing has to be
# done first and nothing is rolled.
#   1. Alice is sent on a walk of several cells toward and past the captain.
#      The walk stops on the first cell within two of him, and he says
#      "You there. State your business."
#   2. Alice steps to another cell within two of him. He says nothing more.
#   3. Alice walks out beyond two and back within. He hails her again.
#   4. Bob walks up. He hails bob too.
#   5. Alice says "Just passing through." He says "Then pass." and notes her
#      `greeted`.
#   6. Alice walks away and back: he says nothing and her walk is not stopped.
#      Bob walks away and back: he is hailed.
version: 5
key: guard-hails-walk
play: { void: transparent, lighting: bright, standing: centre-covered }

templates:
  guard-captain:
    base: dnd5e:monsters:human
    name: Guard Captain
    hitDice: 10d8
    armor: dnd5e:armor:breastplate
    abilities: { str: 15, dex: 14, con: 14, cha: 14 }
    proficiency: 3
    actions: [dnd5e:weapons:longsword, dnd5e:weapons:javelin]

factions:
  - id: garrison

dispositions:
  - { between: [garrison, party], stance: neutral }

behaviorDefinitions:
  captain-policy:
    recipe:
      ref: site:behaviors:captain-policy
      initial: in-hall
      states:
        in-hall:
          transitions:
            - on: approached
              when:
                all:
                  - scope: { within: 2 }
                  - not: { fact: { name: noted:greeted, op: eq, value: true } }
              do:
                - pick: hail
    table:
      hail:
        - say: You there. State your business.

room:
  version: 3
  id: room-1
  name: The Guard Hails
  coordinateFrame: { horizontalPlane: world-xz, verticalAxis: world-y-up,
    distanceUnit: world-scene-unit, hexRadius: 1,
    footprintFrame: owner-local-xz }
  scene:
    version: 1
    id: scene-1
    name: The Guard Hails
    items: []
    groups: []
  room:
    implicitRegionId: hall
    walls:
      - id: gate-wall
        label: gate-wall
        line: { start: { x: -9.5, z: 9.75 }, end: { x: 9.5, z: 9.75 } }
        appearance:
          assetRef: dnd5e:env:dark-fortress:45_wall_01
          height: 3
          thickness: 0.3
          elevation: 0
        blocker:
          blocksMovement: true
          blocksLineOfSight: true
          footprint: { width: 19, depth: 0.5, offsetX: 0, offsetZ: 0 }
        openings:
          - id: gate-wall-opening
            position: 9.5
            width: 2
            door:
              id: gate-wall-door
              assetRef: dnd5e:env:dark-fortress:wall_door_double_01
    regions:
      - id: hall
        name: Hall
        lighting: { intensity: 1 }
        cells:
          - { r: 3, q: [[-5, 2]] }
          - { r: 4, q: [[-6, 2]] }
          - { r: 5, q: [[-6, 1]] }
          - { r: 6, q: [[-7, 1]] }
      - id: yard
        name: Yard
        lighting: { intensity: 1 }
        cells:
          - { r: 7, q: [[-7, 0]] }
          - { r: 8, q: [[-8, 0]] }
          - { r: 9, q: [[-8, -1]] }
          - { r: 10, q: [[-9, -1]] }
    propDeclarations: {}
    arrangementDeclarations: {}
    partyStart: { q: -3, r: 4 }
    monsterDeclarations:
      - id: captain
        ref: dnd5e:monsters:guard-captain
        startingCell: { location: { q: 1, r: 4 }, facing: w }
    doorBindings:
      gate-wall-door: {}
    monsterBindings:
      captain:
        faction: garrison
        options:
          - id: passing
            say: Just passing through.
            requires:
              not: { noted: greeted }
            success:
              - say: Then pass.
                give: { topic: greeted, to: spoken_to, about: speaker }
        behaviors:
          - id: policy
            use: captain-policy
        behaviorState: policy
