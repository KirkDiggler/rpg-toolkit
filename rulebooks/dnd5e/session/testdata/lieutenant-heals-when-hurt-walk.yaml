# THE LIEUTENANT HEALS WHEN HURT AND BACKS AWAY (rpg-project#1131, slices 4c and
# 4c-2): a small walk site, copied from lieutenant-uses-second-wind-walk.yaml (the
# same hall, gate and placement), with TWO changes to what is authored: his stat
# block is 6d8 hit dice (27 hit points; the earlier site's 9 put "30%" at 2 or
# fewer, which a fighter's blows usually pass on the way to killing him), and his
# table asks about his own hit points. One open hall, a fighter at one end, and
# ONE hostile creature, the Lieutenant, 3 cells from her start. His table says,
# in this order:
#   1. At 30% of his maximum or less (8 of his 27) he uses Second Wind, and only
#      once: nothing gives the use back in a run (a rest does), so once it is
#      spent the row is not on his table, however hurt he is. It heals him 1d10
#      plus 1, up to his maximum. `30%` is a share of his maximum, compared
#      exactly; a bare number is hit points.
#   2. At 5 hit points or fewer he backs away from his enemy and does not swing.
#      The 5 is a number of hit points, not a share. It is the AUTHOR'S estimate
#      of "one more hit could kill me": the engine does not work out what a hit
#      would do, it only compares the number. He has no way to slip away safely
#      (no Disengage), so backing off from someone in his reach gives her an
#      opportunity attack.
#   3. Otherwise (above 5) he walks to her, and when she is in reach he swings.
#      Those two rows carry `not` the same number, so a row that says "away" and
#      a row that says "swing" are never both true.
# Issue: https://github.com/KirkDiggler/rpg-project/issues/1246
version: 5
key: lieutenant-heals-when-hurt-walk
play: { void: transparent, lighting: bright, standing: centre-covered }

templates:
  gate-lieutenant:
    base: dnd5e:monsters:human
    name: Lieutenant
    hitDice: 6d8
    actions: [dnd5e:weapons:longsword]
    lets:
      - use: second wind
        with: { level: 1 }
        uses: { max: 1, refills: { on: [short rest, long rest] } }

factions:
  - id: garrison

dispositions:
  - { between: [garrison, party], stance: hostile }

behaviorDefinitions:
  lieutenant-policy:
    recipe:
      ref: site:behaviors:lieutenant-policy
      initial: fighting
      states:
        fighting:
          transitions:
            - { on: time, do: [{ pick: time }] }
            - { on: turn, do: [{ pick: time }] }
    table:
      time:
        - { when: { hit_points: { at_most: 30% } }, activate: second wind }
        - { when: { hit_points: { at_most: 5 } }, away: enemy }
        - { when: [{ not: { hit_points: { at_most: 5 } } }, { enemy: walk }], toward: enemy }
        - { when: [{ not: { hit_points: { at_most: 5 } } }, { enemy: reach }], attack: enemy }

room:
  version: 3
  id: room-1
  name: The Lieutenant Heals When Hurt
  coordinateFrame: { horizontalPlane: world-xz, verticalAxis: world-y-up,
    distanceUnit: world-scene-unit, hexRadius: 1,
    footprintFrame: owner-local-xz }
  scene:
    version: 1
    id: scene-1
    name: The Lieutenant Heals When Hurt
    items: []
    groups: []
  room:
    implicitRegionId: hall
    walls:
      - id: gate-wall
        label: gate-wall
        line: { start: { x: -9.5, z: 9.75 }, end: { x: 9.5, z: 9.75 } }
        appearance:
          assetRef: dnd5e:env:dark-fortress:45_wall_01
          height: 3
          thickness: 0.3
          elevation: 0
        blocker:
          blocksMovement: true
          blocksLineOfSight: true
          footprint: { width: 19, depth: 0.5, offsetX: 0, offsetZ: 0 }
        openings:
          - id: gate-wall-opening
            position: 9.5
            width: 2
            door:
              id: gate-wall-door
              assetRef: dnd5e:env:dark-fortress:wall_door_double_01
    regions:
      - id: hall
        name: Hall
        lighting: { intensity: 1 }
        cells:
          - { r: 3, q: [[-10, 4]] }
          - { r: 4, q: [[-11, 3]] }
          - { r: 5, q: [[-11, 3]] }
          - { r: 6, q: [[-12, 2]] }
      - id: yard
        name: Yard
        lighting: { intensity: 1 }
        cells:
          - { r: 7, q: [[-7, 0]] }
          - { r: 8, q: [[-8, 0]] }
          - { r: 9, q: [[-8, -1]] }
          - { r: 10, q: [[-9, -1]] }
    propDeclarations: {}
    arrangementDeclarations: {}
    partyStart: { q: -8, r: 4 }
    monsterDeclarations:
      - id: lieutenant
        ref: dnd5e:monsters:gate-lieutenant
        startingCell: { location: { q: -5, r: 4 }, facing: w }
    doorBindings:
      gate-wall-door: {}
    monsterBindings:
      lieutenant:
        faction: garrison
        behaviors:
          - id: policy
            use: lieutenant-policy
        behaviorState: policy
