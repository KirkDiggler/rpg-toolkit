# A LOOTED ITEM LANDS IN THE INVENTORY (rpg-project#850, #1169): a small walk
# site, copied from second-wind-walk.yaml. One hostile creature, the Lieutenant,
# has a custom cloak equipped.
#   1. The fighter downs the Lieutenant and loots the body.
#   2. The cloak is in their inventory, not worn.
#   3. They put it on; the cloak's Second Wind is a row beside their own.
#   4. They use it: the cloak is spent, their own Second Wind is not.
version: 5
key: lieutenants-cloak-walk
play: { void: transparent, lighting: bright, standing: centre-covered }

templates:
  sparring-guard:
    base: dnd5e:monsters:human
    name: Lieutenant
    hitDice: 2d8
    actions: [dnd5e:weapons:dagger]

customItems:
  lieutenants-cloak:
    name: Lieutenant's cloak
    slot: cloak
    charges: { max: 1, refills: { on: [short rest, long rest] } }
    lets:
      - use: second wind
        with: { level: 1 }
        cost: { charges: 1 }

factions:
  - id: garrison

dispositions:
  - { between: [garrison, party], stance: hostile }

behaviorDefinitions:
  sparring-policy:
    recipe:
      ref: site:behaviors:sparring-policy
      initial: fighting
      states:
        fighting:
          transitions:
            - { on: time, do: [{ pick: time }] }
            - { on: turn, do: [{ pick: time }] }
    table:
      time:
        - { when: { enemy: reach }, attack: enemy }

room:
  version: 3
  id: room-1
  name: A Second Wind
  coordinateFrame: { horizontalPlane: world-xz, verticalAxis: world-y-up,
    distanceUnit: world-scene-unit, hexRadius: 1,
    footprintFrame: owner-local-xz }
  scene:
    version: 1
    id: scene-1
    name: A Second Wind
    items: []
    groups: []
  room:
    implicitRegionId: hall
    walls:
      - id: gate-wall
        label: gate-wall
        line: { start: { x: -9.5, z: 9.75 }, end: { x: 9.5, z: 9.75 } }
        appearance:
          assetRef: dnd5e:env:dark-fortress:45_wall_01
          height: 3
          thickness: 0.3
          elevation: 0
        blocker:
          blocksMovement: true
          blocksLineOfSight: true
          footprint: { width: 19, depth: 0.5, offsetX: 0, offsetZ: 0 }
        openings:
          - id: gate-wall-opening
            position: 9.5
            width: 2
            door:
              id: gate-wall-door
              assetRef: dnd5e:env:dark-fortress:wall_door_double_01
    regions:
      - id: hall
        name: Hall
        lighting: { intensity: 1 }
        cells:
          - { r: 3, q: [[-5, 2]] }
          - { r: 4, q: [[-6, 2]] }
          - { r: 5, q: [[-6, 1]] }
          - { r: 6, q: [[-7, 1]] }
      - id: yard
        name: Yard
        lighting: { intensity: 1 }
        cells:
          - { r: 7, q: [[-7, 0]] }
          - { r: 8, q: [[-8, 0]] }
          - { r: 9, q: [[-8, -1]] }
          - { r: 10, q: [[-9, -1]] }
    propDeclarations: {}
    arrangementDeclarations: {}
    partyStart: { q: -3, r: 4 }
    monsterDeclarations:
      - id: guard
        ref: dnd5e:monsters:sparring-guard
        startingCell: { location: { q: -2, r: 4 }, facing: w }
    doorBindings:
      gate-wall-door: {}
    monsterBindings:
      guard:
        faction: garrison
        equipment: [lieutenants-cloak]
        behaviors:
          - id: policy
            use: sparring-policy
        behaviorState: policy
